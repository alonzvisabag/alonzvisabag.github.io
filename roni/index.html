<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לרונני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --bg1:#fff3da;
    --bg2:#ffdff0;
    --bg3:#dff4ff;
    --ink:#332b2b;
    --muted:#8d7f8a;
    --card:#fffefc;
    --coral:#ff6b4a;
    --coral-dark:#e8512f;
    --sun:#ffb703;
    --sun-dark:#e39a00;
    --mint:#06b88a;
    --mint-dark:#049470;
    --sky:#3fa9dd;
    --sky-dark:#2a8bc0;
    --border:#f0e2d4;
  }

  html{ background:var(--bg1); }

  body{
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    background-size:200% 200%;
    animation:flow 18s ease-in-out infinite;
    overflow-x:hidden;
    position:relative;
  }

  @keyframes flow{
    0%{ background-position:0% 30%; }
    50%{ background-position:100% 70%; }
    100%{ background-position:0% 30%; }
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(50px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }
  .blob1{ width:340px; height:340px; background:var(--coral); top:-100px; right:-100px; }
  .blob2{ width:280px; height:280px; background:var(--sky); bottom:0; left:-120px; }
  .blob3{ width:220px; height:220px; background:var(--sun); top:40%; right:-100px; }

  /* ── GATE ── */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    z-index:2;
  }

  #gate-card{
    background:var(--card);
    border-radius:26px;
    padding:44px 32px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 16px 50px rgba(232,81,47,0.16);
    transform:rotate(-0.6deg);
  }

  #gate-card .emoji{ font-size:2.6rem; margin-bottom:14px; }

  #gate-photo{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:16px;
    margin:0 auto 18px;
    display:block;
    transform:rotate(-3deg);
    box-shadow:0 10px 26px rgba(0,0,0,0.16);
  }
  #gate-photo[hidden]{ display:none; }

  #gate-card h1{
    font-size:1.9rem;
    font-weight:800;
    margin-bottom:10px;
  }

  #gate-card p{
    color:var(--muted);
    font-size:0.95rem;
    line-height:1.6;
    margin-bottom:26px;
  }

  #gate-form{ display:flex; flex-direction:column; gap:12px; }

  #pw-input{
    font-family:'Rubik', sans-serif;
    font-size:1rem;
    padding:14px 16px;
    border-radius:14px;
    border:2px solid var(--border);
    text-align:center;
    background:#fff;
    outline:none;
    transition:border-color .15s;
  }
  #pw-input:focus{ border-color:var(--coral); }

  .btn{
    font-family:'Rubik', sans-serif;
    font-size:1rem;
    font-weight:700;
    padding:14px 16px;
    border-radius:14px;
    border:none;
    background:linear-gradient(100deg, var(--coral), var(--sun));
    color:#fff;
    cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
    box-shadow:0 6px 0 var(--coral-dark);
  }
  .btn:hover{ transform:translateY(-2px) scale(1.02); }
  .btn:active{ transform:translateY(2px) scale(0.98); box-shadow:0 3px 0 var(--coral-dark); }

  #gate-error{
    color:#c94a3a;
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
    font-weight:500;
  }

  @keyframes shake{
    0%,100%{ transform:translateX(0) rotate(-0.6deg); }
    20%{ transform:translateX(-8px) rotate(-0.6deg); }
    40%{ transform:translateX(8px) rotate(-0.6deg); }
    60%{ transform:translateX(-6px) rotate(-0.6deg); }
    80%{ transform:translateX(6px) rotate(-0.6deg); }
  }
  .shake{ animation:shake .4s; }

  /* ── REVEAL ── */
  #reveal-screen{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:22px;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    text-align:center;
    padding:24px;
  }
  #reveal-screen.show{ display:flex; }

  #reveal-photo{
    width:min(78vw, 320px);
    max-height:60vh;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    opacity:0;
    transform:scale(0.3) rotate(-16deg);
  }
  #reveal-photo.pop{
    animation:reveal-pop .9s cubic-bezier(.22,1.4,.36,1) forwards;
  }
  @keyframes reveal-pop{
    0%{ opacity:0; transform:scale(0.3) rotate(-16deg); }
    55%{ opacity:1; transform:scale(1.1) rotate(4deg); }
    75%{ transform:scale(0.96) rotate(-2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  #reveal-caption{
    font-size:1.15rem;
    font-weight:700;
    opacity:0;
  }
  #reveal-caption.show-text{ animation:fade-up .5s ease forwards; animation-delay:.6s; }
  @keyframes fade-up{
    0%{ opacity:0; transform:translateY(10px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  #reveal-continue{
    opacity:0;
    pointer-events:none;
  }
  #reveal-continue.show-text{ animation:fade-up .5s ease forwards; animation-delay:1s; pointer-events:auto; }

  /* ── SITE ── */
  #site{ display:none; position:relative; z-index:2; }

  header.hero{
    text-align:center;
    padding:60px 20px 20px;
  }

  #hero-photos{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:22px;
    min-height:0;
  }

  #hero-photos .polaroid{
    background:#fff;
    padding:8px 8px 20px;
    border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,0.12);
    width:100px;
    animation:bob 4.5s ease-in-out infinite;
  }
  #hero-photos .polaroid:nth-child(2n){ animation-delay:.6s; transform:rotate(-4deg); }
  #hero-photos .polaroid:nth-child(3n){ animation-delay:1.2s; transform:rotate(5deg); }
  #hero-photos .polaroid:nth-child(3n+1){ transform:rotate(-3deg); }
  #hero-photos .polaroid:first-child{ transform:rotate(-10deg); }
  #hero-photos .polaroid img{ width:100%; height:84px; object-fit:cover; border-radius:4px; display:block; }

  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); }
    50%{ transform:translateY(-10px) rotate(var(--r,0deg)); }
  }

  header.hero h1{
    font-size:2.6rem;
    font-weight:900;
    margin-bottom:10px;
    letter-spacing:-0.5px;
  }

  header.hero p{
    color:var(--muted);
    font-size:1.05rem;
    max-width:480px;
    margin:0 auto;
    line-height:1.7;
    font-weight:500;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:10px 20px 100px;
  }

  #home-strip{
    max-width:640px;
    margin:0 auto 30px;
    padding:0 20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .home-card{
    flex:1;
    min-width:150px;
    background:var(--card);
    border-radius:16px;
    padding:16px 18px;
    box-shadow:0 6px 20px rgba(0,0,0,0.06);
  }

  .home-card h3{
    font-size:0.95rem;
    font-weight:800;
    margin-bottom:6px;
  }

  .home-time{
    font-size:1.5rem;
    font-weight:800;
    color:var(--coral-dark);
    margin-bottom:8px;
  }

  .home-weather-list{
    display:flex;
    flex-direction:column;
    gap:3px;
  }

  .weather-row{
    display:flex;
    justify-content:space-between;
    font-size:0.85rem;
    color:var(--muted);
    font-weight:500;
  }

  .home-weather-single{
    font-size:0.9rem;
    color:var(--muted);
    font-weight:600;
  }

  section.act{ margin-bottom:60px; }

  section.act .act-head{
    text-align:center;
    margin-bottom:26px;
  }

  section.act .act-badge{
    display:inline-block;
    font-size:0.78rem;
    font-weight:700;
    color:#fff;
    padding:5px 16px;
    border-radius:20px;
    margin-bottom:10px;
  }

  section.act .act-head h2{
    font-size:1.6rem;
    font-weight:800;
  }

  section.act .act-head span{
    display:block;
    color:var(--muted);
    font-size:0.92rem;
    margin-top:4px;
    font-weight:500;
  }

  section.extra .act-head{
    border-top:2px dashed var(--border);
    padding-top:34px;
  }

  .capsule-list{ display:flex; flex-direction:column; gap:16px; }

  .capsule{
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    transform:rotate(var(--tilt, 0deg));
    box-shadow:0 6px 0 var(--shadow-c, var(--border)), 0 10px 24px rgba(0,0,0,0.06);
  }
  .capsule-list .capsule:nth-child(4n+1){ --tilt:-0.7deg; }
  .capsule-list .capsule:nth-child(4n+2){ --tilt:0.6deg; }
  .capsule-list .capsule:nth-child(4n+3){ --tilt:-0.5deg; }
  .capsule-list .capsule:nth-child(4n+4){ --tilt:0.8deg; }

  .capsule:hover{
    transform:rotate(0deg) translateY(-3px) scale(1.01);
  }

  .capsule-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px;
  }

  .capsule-trigger{
    font-size:0.98rem;
    line-height:1.5;
    flex:1;
    font-weight:500;
  }

  .capsule-type{
    font-size:0.72rem;
    font-weight:700;
    color:#fff;
    padding:4px 11px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }

  .capsule-open-btn{
    display:block;
    width:calc(100% - 40px);
    margin:0 20px 18px;
    font-family:'Rubik', sans-serif;
    font-size:0.92rem;
    font-weight:700;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--locked-bg, #fdeee0);
    color:var(--ink);
    cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .capsule-open-btn:hover{ transform:scale(1.03); }
  .capsule-open-btn:active{ transform:scale(0.96); }

  .capsule-body{
    display:none;
    padding:0 20px 22px;
    border-top:2px dashed var(--border);
  }

  .capsule.expanded .capsule-body{ display:block; padding-top:18px; animation:pop-in .35s cubic-bezier(.34,1.56,.64,1); }
  .capsule.unlocked .capsule-head{ cursor:pointer; }

  .capsule-chevron{
    display:none;
    font-size:0.9rem;
    color:var(--muted);
    flex-shrink:0;
    transition:transform .2s;
  }
  .capsule.unlocked .capsule-chevron{ display:inline-block; }
  .capsule.expanded .capsule-chevron{ transform:rotate(180deg); }

  @keyframes pop-in{
    0%{ opacity:0; transform:scale(0.92) translateY(6px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }

  .capsule-body .letter-text{
    font-size:1.05rem;
    line-height:1.85;
    white-space:pre-line;
    font-weight:400;
  }

  .capsule-body .item{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .capsule-body .item + .item{
    margin-top:20px;
    padding-top:20px;
    border-top:2px dashed var(--border);
  }
  .capsule-body .item-from{
    font-size:0.82rem;
    font-weight:700;
    color:var(--muted);
  }

  .capsule-body img, .capsule-body video{
    width:100%;
    border-radius:12px;
    display:block;
  }

  .capsule-body audio{ width:100%; }

  .photo-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .photo-grid img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
    display:block;
  }

  .capsule-body .placeholder{
    color:var(--muted);
    font-size:0.92rem;
    text-align:center;
    padding:10px 0;
    font-weight:500;
  }

  /* confetti */
  .confetti-piece{
    position:fixed;
    width:9px;
    height:9px;
    border-radius:2px;
    pointer-events:none;
    z-index:50;
    animation:confetti-pop .8s ease-out forwards;
  }
  @keyframes confetti-pop{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
    100%{ transform:var(--end, translate(0,-120px)) rotate(360deg) scale(0.6); opacity:0; }
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
  }

  #reset-link{
    font-size:0.78rem;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Rubik', sans-serif;
    font-weight:500;
  }

  .footer-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:16px;
  }

  #memory-open-btn, #nickname-open-btn{
    padding:12px 26px;
  }

  #memory-view{
    display:none;
    position:fixed;
    inset:0;
    z-index:60;
    overflow-y:auto;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    padding:20px;
  }
  #memory-view.show{ display:block; }

  #memory-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:520px;
    margin:0 auto 18px;
  }
  #memory-header h2{ font-size:1.3rem; font-weight:800; }
  #memory-back-btn{
    background:none;
    border:none;
    font-family:'Rubik', sans-serif;
    font-size:0.92rem;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
  }

  #memory-grid{
    max-width:520px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }

  .memory-card{
    aspect-ratio:1;
    border-radius:12px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg, var(--coral), var(--sun));
    box-shadow:0 4px 0 var(--coral-dark);
    transition:transform .15s;
  }
  .memory-card:active{ transform:scale(0.94); }
  .memory-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .memory-card.flipped img, .memory-card.matched img{ display:block; }
  .memory-card.flipped, .memory-card.matched{ box-shadow:none; }
  .memory-card.matched{ opacity:0.5; }

  #memory-win{
    display:none;
    max-width:520px;
    margin:26px auto 0;
    text-align:center;
  }
  #memory-win p{ font-size:1.1rem; font-weight:700; margin-bottom:14px; }

  #nickname-view{
    display:none;
    position:fixed;
    inset:0;
    z-index:60;
    overflow-y:auto;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    padding:20px;
  }
  #nickname-view.show{ display:block; }

  #nickname-card{
    max-width:420px;
    margin:10px auto 0;
    background:var(--card);
    border-radius:20px;
    padding:30px 24px;
    text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,0.08);
  }

  #nickname-score{
    font-size:0.85rem;
    font-weight:700;
    color:var(--muted);
    margin-bottom:20px;
  }

  #nickname-tiles{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:22px;
  }
  .nickname-tile{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--coral), var(--sun));
    color:#fff;
    font-weight:800;
    font-size:1.1rem;
  }

  #nickname-input{
    width:100%;
    font-family:'Rubik', sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid var(--border);
    text-align:center;
    outline:none;
    margin-bottom:14px;
  }
  #nickname-input:focus{ border-color:var(--coral); }

  #nickname-btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:14px;
  }
  #nickname-btn-row .btn{ flex:1; padding:12px; }
  #nickname-skip-btn{
    flex:1;
    background:none;
    border:1.5px solid var(--border);
    border-radius:12px;
    font-family:'Rubik', sans-serif;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
  }

  #nickname-feedback{
    font-size:0.95rem;
    font-weight:700;
    min-height:1.4em;
  }
  #nickname-feedback.ok{ color:var(--mint-dark); }
  #nickname-feedback.err{ color:var(--coral-dark); }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div id="gate">
  <div id="gate-card">
    <img id="gate-photo" src="media/gate-before.jpg" alt="" hidden>
    <h1>לרונני</h1>
    <p id="gate-subtitle">כמה דברים שהחברים שלך רצו שיחכו לך כאן</p>
    <form id="gate-form">
      <input type="password" id="pw-input" placeholder="סיסמה" autocomplete="off">
      <button class="btn" type="submit">פתחי לי</button>
    </form>
    <div id="gate-error"></div>
  </div>
</div>

<div id="reveal-screen">
  <img id="reveal-photo" src="" alt="">
  <div id="reveal-caption">יאללה, בואי נתחיל</div>
  <button id="reveal-continue" class="btn" type="button">בואי נמשיך ←</button>
</div>

<div id="site">
  <header class="hero">
    <div id="hero-photos"></div>
    <h1 id="site-title">לרונני</h1>
    <p id="site-subtitle">כמה דברים שהחברים שלך רצו שיחכו לך כאן</p>
  </header>
  <main id="main"></main>
  <footer>
    <div class="footer-buttons">
      <button id="memory-open-btn" class="btn">משחק זיכרון</button>
      <button id="nickname-open-btn" class="btn">פאזל כינויים</button>
    </div>
    <button id="reset-link">נעלי הכל מחדש</button>
  </footer>
</div>

<div id="memory-view">
  <div id="memory-header">
    <button id="memory-back-btn" type="button">← חזרה</button>
    <h2>משחק זיכרון</h2>
  </div>
  <div id="memory-grid"></div>
  <div id="memory-win">
    <p>כל הכבוד! מצאת את כל הזוגות.</p>
    <button id="memory-replay-btn" class="btn" type="button">שחקי שוב</button>
  </div>
</div>

<div id="nickname-view">
  <div id="memory-header">
    <button id="nickname-back-btn" type="button">← חזרה</button>
    <h2>פאזל כינויים</h2>
  </div>
  <div id="nickname-card">
    <p id="nickname-score"></p>
    <div id="nickname-tiles"></div>
    <input type="text" id="nickname-input" placeholder="מה הכינוי?">
    <div id="nickname-btn-row">
      <button id="nickname-submit-btn" class="btn" type="button">בדקי</button>
      <button id="nickname-skip-btn" type="button">דלגי</button>
    </div>
    <p id="nickname-feedback"></p>
    <button id="nickname-replay-btn" class="btn" type="button" style="display:none">שחקי שוב</button>
  </div>
</div>

<script>
const TYPE_META = {
  letter:   { label: 'מכתב',    color: 'var(--coral)' },
  audio:    { label: 'הקלטה',   color: 'var(--sky)' },
  video:    { label: 'וידאו',    color: 'var(--mint)' },
  photo:    { label: 'תמונה',    color: 'var(--sun)' },
  playlist: { label: 'פלייליסט', color: 'var(--sky)' },
  idea:     { label: 'רעיון',    color: 'var(--mint)' }
};

const ACT_COLORS = [
  { badge:'var(--coral)', shadow:'#ffd8cc' },
  { badge:'var(--sky)',   shadow:'#cdeeff' },
  { badge:'var(--mint)',  shadow:'#c8f3e6' },
  { badge:'var(--sun)',   shadow:'#ffe9b8' }
];

const OPENED_KEY = 'roni_opened_capsules';
const CONFETTI_COLORS = ['var(--coral)','var(--sun)','var(--mint)','var(--sky)'];

function getOpened(){
  try { return JSON.parse(localStorage.getItem(OPENED_KEY) || '[]'); }
  catch(e){ return []; }
}
function markOpened(id){
  const opened = getOpened();
  if(!opened.includes(id)){
    opened.push(id);
    localStorage.setItem(OPENED_KEY, JSON.stringify(opened));
  }
}

function burstConfetti(x, y){
  for(let i=0;i<12;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    piece.style.background = color;
    if(Math.random() > 0.5) piece.style.borderRadius = '50%';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*70;
    const ex = Math.cos(angle)*dist;
    const ey = Math.sin(angle)*dist - 40;
    piece.style.left = x + 'px';
    piece.style.top = y + 'px';
    piece.style.setProperty('--end', `translate(${ex}px, ${ey}px)`);
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 850);
  }
}

const AUDIO_EXT = ['mp3','wav','m4a','ogg','aac'];
const VIDEO_EXT = ['mp4','mov','webm','m4v'];
const IMG_EXT   = ['jpg','jpeg','png','gif','webp'];

function detectMediaType(media){
  const ext = media.split('.').pop().toLowerCase();
  if(AUDIO_EXT.includes(ext)) return 'audio';
  if(VIDEO_EXT.includes(ext)) return 'video';
  if(IMG_EXT.includes(ext)) return 'photo';
  return null;
}

function effectiveType(c){
  const withMedia = (c.items || []).find(i => i.media);
  if(withMedia){
    const detected = detectMediaType(withMedia.media);
    if(detected) return detected;
  }
  return c.type;
}

function mediaTag(media){
  if(!media) return null;
  const ext = media.split('.').pop().toLowerCase();
  const src = 'media/' + media;
  if(AUDIO_EXT.includes(ext)) return `<audio controls src="${src}"></audio>`;
  if(VIDEO_EXT.includes(ext)) return `<video controls src="${src}"></video>`;
  if(IMG_EXT.includes(ext))   return `<img src="${src}" alt="">`;
  return `<a href="${src}" target="_blank">פתחי קובץ</a>`;
}

function itemHTML(item){
  const parts = [];
  if(item.from){
    parts.push(`<div class="item-from">מ${item.from}</div>`);
  }
  if(item.text){
    parts.push(`<div class="letter-text">${item.text.replace(/</g,'&lt;')}</div>`);
  }
  if(item.media){
    parts.push(mediaTag(item.media));
  }
  return `<div class="item">${parts.join('')}</div>`;
}

function isPhotoOnly(item){
  if(item.from || item.text || !item.media) return false;
  return detectMediaType(item.media) === 'photo';
}

function capsuleBodyHTML(c){
  const items = c.items || [];
  if(!items.length){
    return `<div class="placeholder">התוכן בדרך אליך... (עוד לא הועלה)</div>`;
  }
  if(items.length > 1 && items.every(isPhotoOnly)){
    const imgs = items.map(i => `<img src="media/${i.media}" alt="">`).join('');
    return `<div class="photo-grid">${imgs}</div>`;
  }
  return items.map(itemHTML).join('');
}

function updateCapsuleBtnLabel(div){
  const btn = div.querySelector('.capsule-open-btn');
  btn.textContent = div.classList.contains('expanded') ? 'סגרי' : 'זה קורה לי עכשיו';
}

function renderCapsule(c){
  const meta = TYPE_META[effectiveType(c)] || { label:'', color:'var(--coral)' };
  const unlocked = getOpened().includes(c.id);
  const div = document.createElement('div');
  div.className = 'capsule' + (unlocked ? ' unlocked' : '');
  div.dataset.id = c.id;
  div.innerHTML = `
    <div class="capsule-head">
      <span class="capsule-trigger">${c.trigger}</span>
      <span class="capsule-chevron">▾</span>
      <span class="capsule-type" style="background:${meta.color}">${meta.label}</span>
    </div>
    <button class="capsule-open-btn" type="button">זה קורה לי עכשיו</button>
    <div class="capsule-body">${capsuleBodyHTML(c)}</div>
  `;
  const head = div.querySelector('.capsule-head');
  const btn = div.querySelector('.capsule-open-btn');
  updateCapsuleBtnLabel(div);

  const toggle = (e) => {
    const wasExpanded = div.classList.contains('expanded');
    div.classList.add('unlocked');
    div.classList.toggle('expanded');
    markOpened(c.id);
    updateCapsuleBtnLabel(div);
    if(!wasExpanded) burstConfetti(e.clientX, e.clientY);
  };
  btn.addEventListener('click', toggle);
  head.addEventListener('click', (e) => {
    if(div.classList.contains('unlocked')) toggle(e);
  });
  return div;
}

function renderHeroPhotos(photos){
  const wrap = document.getElementById('hero-photos');
  if(photos && photos.length){
    wrap.innerHTML = photos.map(p => `<div class="polaroid"><img src="media/${p}" alt=""></div>`).join('');
  } else {
    wrap.innerHTML = '';
  }
}

function renderSite(data){
  document.getElementById('site-title').textContent = data.site.title || 'לרונני';
  document.getElementById('site-subtitle').textContent = data.site.subtitle || '';
  renderHeroPhotos(data.site.heroPhotos);
  const main = document.getElementById('main');
  main.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'capsule-list';
  const allCapsules = [...data.acts.flatMap(a => a.capsules), ...(data.extra ? data.extra.capsules : [])];
  allCapsules.forEach((c, i) => {
    const colors = ACT_COLORS[i % ACT_COLORS.length];
    const capsule = renderCapsule(c);
    capsule.style.setProperty('--shadow-c', colors.shadow);
    list.appendChild(capsule);
  });
  main.appendChild(list);
}

function showSite(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('reveal-screen').classList.remove('show');
  document.getElementById('site').style.display = 'block';
}

function playReveal(data, onDone){
  document.getElementById('gate').style.display = 'none';
  const screen = document.getElementById('reveal-screen');
  const photo = document.getElementById('reveal-photo');
  const caption = document.getElementById('reveal-caption');
  const continueBtn = document.getElementById('reveal-continue');

  photo.onerror = () => { photo.style.display = 'none'; };
  photo.onload = () => { photo.style.display = 'block'; };
  photo.src = 'media/' + (data.site.revealPhoto || '');
  photo.classList.remove('pop');
  caption.classList.remove('show-text');
  continueBtn.classList.remove('show-text');
  screen.classList.add('show');
  void screen.offsetWidth;

  photo.classList.add('pop');
  caption.classList.add('show-text');
  continueBtn.classList.add('show-text');
  for(let i=0;i<3;i++){
    setTimeout(() => burstConfetti(
      window.innerWidth/2 + (Math.random()-0.5)*160,
      window.innerHeight/2 - 40
    ), 200 + i*180);
  }

  let done = false;
  const finish = () => {
    if(done) return;
    done = true;
    onDone();
  };
  continueBtn.onclick = finish;
  setTimeout(finish, 2600);
}

fetch('content.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    document.getElementById('gate-subtitle').textContent = data.site.subtitle || '';

    const gatePhoto = document.getElementById('gate-photo');
    if(data.site.gatePhoto){
      gatePhoto.onload = () => gatePhoto.hidden = false;
      gatePhoto.onerror = () => gatePhoto.hidden = true;
      gatePhoto.src = 'media/' + data.site.gatePhoto;
    }

    document.getElementById('gate-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('pw-input').value.trim();
      if(val === (data.site.password || '')){
        renderSite(data);
        playReveal(data, showSite);
      } else {
        const card = document.getElementById('gate-card');
        const err = document.getElementById('gate-error');
        err.textContent = data.site.gateHint || 'סיסמה לא נכונה, נסי שוב';
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    });
  })
  .catch(() => {
    document.getElementById('gate-error').textContent = 'לא הצלחתי לטעון את התוכן. נסי לרענן.';
  });

document.getElementById('reset-link').addEventListener('click', () => {
  if(confirm('לנעול הכל מחדש?')){
    localStorage.removeItem(OPENED_KEY);
    location.reload();
  }
});

const MEMORY_PHOTOS = ['photo-07.jpg','photo-14.jpg','photo-18.jpg','photo-19.jpg','photo-13.jpg','photo-01.jpg','photo-03.jpg','photo-12.jpg'];
let memoryState = { firstCard: null, secondCard: null, lock: false, matched: 0 };

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startMemoryGame(){
  memoryState = { firstCard: null, secondCard: null, lock: false, matched: 0 };
  document.getElementById('memory-win').style.display = 'none';
  const deck = shuffle([...MEMORY_PHOTOS, ...MEMORY_PHOTOS]);
  const grid = document.getElementById('memory-grid');
  grid.innerHTML = '';
  deck.forEach(photo => {
    const card = document.createElement('div');
    card.className = 'memory-card';
    card.dataset.photo = photo;
    card.innerHTML = `<img src="media/${photo}" alt="">`;
    card.addEventListener('click', () => flipMemoryCard(card));
    grid.appendChild(card);
  });
}

function flipMemoryCard(card){
  if(memoryState.lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');

  if(!memoryState.firstCard){
    memoryState.firstCard = card;
    return;
  }

  memoryState.secondCard = card;
  memoryState.lock = true;

  if(memoryState.firstCard.dataset.photo === memoryState.secondCard.dataset.photo){
    memoryState.firstCard.classList.add('matched');
    memoryState.secondCard.classList.add('matched');
    memoryState.matched++;
    memoryState.firstCard = null;
    memoryState.secondCard = null;
    memoryState.lock = false;
    if(memoryState.matched === MEMORY_PHOTOS.length){
      setTimeout(() => {
        document.getElementById('memory-win').style.display = 'block';
        burstConfetti(window.innerWidth / 2, window.innerHeight / 2);
      }, 350);
    }
  } else {
    setTimeout(() => {
      memoryState.firstCard.classList.remove('flipped');
      memoryState.secondCard.classList.remove('flipped');
      memoryState.firstCard = null;
      memoryState.secondCard = null;
      memoryState.lock = false;
    }, 800);
  }
}

document.getElementById('memory-open-btn').addEventListener('click', () => {
  document.getElementById('memory-view').classList.add('show');
  startMemoryGame();
});
document.getElementById('memory-back-btn').addEventListener('click', () => {
  document.getElementById('memory-view').classList.remove('show');
});
document.getElementById('memory-replay-btn').addEventListener('click', startMemoryGame);

const NICKNAMES = ['שניצ','שביצ','אושו','טוסיק','טוכעס','רונן','רונני','רונן מיזרחי',"מצ'קה",'שניצקיפיצ'];
let nickState = { order: [], index: 0, score: 0, current: null };

function scrambleWord(word){
  const chars = word.split('');
  let attempts = 0;
  let scrambled;
  do {
    scrambled = shuffle([...chars]);
    attempts++;
  } while(scrambled.join('') === word && attempts < 20);
  return scrambled;
}

function startNicknameGame(){
  nickState.order = shuffle([...NICKNAMES]);
  nickState.index = 0;
  nickState.score = 0;
  document.getElementById('nickname-input').style.display = 'block';
  document.getElementById('nickname-btn-row').style.display = 'flex';
  document.getElementById('nickname-replay-btn').style.display = 'none';
  nextNicknameRound();
}

function nextNicknameRound(){
  const feedback = document.getElementById('nickname-feedback');
  feedback.textContent = '';
  feedback.className = '';
  document.getElementById('nickname-input').value = '';
  document.getElementById('nickname-score').textContent = `${nickState.score} מתוך ${NICKNAMES.length}`;

  if(nickState.index >= nickState.order.length){
    document.getElementById('nickname-tiles').innerHTML = '';
    feedback.textContent = `סיימת! ${nickState.score} מתוך ${NICKNAMES.length}`;
    feedback.className = 'ok';
    document.getElementById('nickname-input').style.display = 'none';
    document.getElementById('nickname-btn-row').style.display = 'none';
    document.getElementById('nickname-replay-btn').style.display = 'block';
    return;
  }

  const word = nickState.order[nickState.index];
  nickState.current = word;
  const scrambled = scrambleWord(word);
  document.getElementById('nickname-tiles').innerHTML = scrambled
    .map(ch => `<span class="nickname-tile">${ch === ' ' ? '&nbsp;' : ch}</span>`)
    .join('');
  document.getElementById('nickname-input').focus();
}

function checkNicknameGuess(){
  const input = document.getElementById('nickname-input');
  const guess = input.value.trim();
  const feedback = document.getElementById('nickname-feedback');
  if(!guess) return;
  if(guess === nickState.current){
    nickState.score++;
    feedback.textContent = 'נכון!';
    feedback.className = 'ok';
    burstConfetti(window.innerWidth / 2, window.innerHeight / 2);
    nickState.index++;
    setTimeout(nextNicknameRound, 900);
  } else {
    feedback.textContent = 'לא בדיוק, נסי שוב';
    feedback.className = 'err';
  }
}

function skipNickname(){
  document.getElementById('nickname-feedback').textContent = `זה היה: ${nickState.current}`;
  document.getElementById('nickname-feedback').className = '';
  nickState.index++;
  setTimeout(nextNicknameRound, 1200);
}

document.getElementById('nickname-open-btn').addEventListener('click', () => {
  document.getElementById('nickname-view').classList.add('show');
  startNicknameGame();
});
document.getElementById('nickname-back-btn').addEventListener('click', () => {
  document.getElementById('nickname-view').classList.remove('show');
});
document.getElementById('nickname-submit-btn').addEventListener('click', checkNicknameGuess);
document.getElementById('nickname-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') checkNicknameGuess();
});
document.getElementById('nickname-skip-btn').addEventListener('click', skipNickname);
document.getElementById('nickname-replay-btn').addEventListener('click', startNicknameGame);
</script>
