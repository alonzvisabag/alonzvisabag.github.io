<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לרוני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --bg1:#fff3da;
    --bg2:#ffdff0;
    --bg3:#dff4ff;
    --ink:#332b2b;
    --muted:#8d7f8a;
    --card:#fffefc;
    --coral:#ff6b4a;
    --coral-dark:#e8512f;
    --sun:#ffb703;
    --sun-dark:#e39a00;
    --mint:#06b88a;
    --mint-dark:#049470;
    --sky:#3fa9dd;
    --sky-dark:#2a8bc0;
    --border:#f0e2d4;
  }

  html{ background:var(--bg1); }

  body{
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    background-size:200% 200%;
    animation:flow 18s ease-in-out infinite;
    overflow-x:hidden;
    position:relative;
  }

  @keyframes flow{
    0%{ background-position:0% 30%; }
    50%{ background-position:100% 70%; }
    100%{ background-position:0% 30%; }
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(50px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }
  .blob1{ width:340px; height:340px; background:var(--coral); top:-100px; right:-100px; }
  .blob2{ width:280px; height:280px; background:var(--sky); bottom:0; left:-120px; }
  .blob3{ width:220px; height:220px; background:var(--sun); top:40%; right:-100px; }

  /* ── GATE ── */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    z-index:2;
  }

  #gate-card{
    background:var(--card);
    border-radius:26px;
    padding:44px 32px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 16px 50px rgba(232,81,47,0.16);
    transform:rotate(-0.6deg);
  }

  #gate-card .emoji{ font-size:2.6rem; margin-bottom:14px; }

  #gate-photo{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:16px;
    margin:0 auto 18px;
    display:block;
    transform:rotate(-3deg);
    box-shadow:0 10px 26px rgba(0,0,0,0.16);
  }
  #gate-photo[hidden]{ display:none; }

  #gate-card h1{
    font-size:1.9rem;
    font-weight:800;
    margin-bottom:10px;
  }

  #gate-card p{
    color:var(--muted);
    font-size:0.95rem;
    line-height:1.6;
    margin-bottom:26px;
  }

  #gate-form{ display:flex; flex-direction:column; gap:12px; }

  #pw-input{
    font-family:'Rubik', sans-serif;
    font-size:1rem;
    padding:14px 16px;
    border-radius:14px;
    border:2px solid var(--border);
    text-align:center;
    background:#fff;
    outline:none;
    transition:border-color .15s;
  }
  #pw-input:focus{ border-color:var(--coral); }

  .btn{
    font-family:'Rubik', sans-serif;
    font-size:1rem;
    font-weight:700;
    padding:14px 16px;
    border-radius:14px;
    border:none;
    background:linear-gradient(100deg, var(--coral), var(--sun));
    color:#fff;
    cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
    box-shadow:0 6px 0 var(--coral-dark);
  }
  .btn:hover{ transform:translateY(-2px) scale(1.02); }
  .btn:active{ transform:translateY(2px) scale(0.98); box-shadow:0 3px 0 var(--coral-dark); }

  #gate-error{
    color:#c94a3a;
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
    font-weight:500;
  }

  @keyframes shake{
    0%,100%{ transform:translateX(0) rotate(-0.6deg); }
    20%{ transform:translateX(-8px) rotate(-0.6deg); }
    40%{ transform:translateX(8px) rotate(-0.6deg); }
    60%{ transform:translateX(-6px) rotate(-0.6deg); }
    80%{ transform:translateX(6px) rotate(-0.6deg); }
  }
  .shake{ animation:shake .4s; }

  /* ── REVEAL ── */
  #reveal-screen{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:22px;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    text-align:center;
    padding:24px;
  }
  #reveal-screen.show{ display:flex; }

  #reveal-photo{
    width:min(78vw, 320px);
    max-height:60vh;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    opacity:0;
    transform:scale(0.3) rotate(-16deg);
  }
  #reveal-photo.pop{
    animation:reveal-pop .9s cubic-bezier(.22,1.4,.36,1) forwards;
  }
  @keyframes reveal-pop{
    0%{ opacity:0; transform:scale(0.3) rotate(-16deg); }
    55%{ opacity:1; transform:scale(1.1) rotate(4deg); }
    75%{ transform:scale(0.96) rotate(-2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  #reveal-caption{
    font-size:1.15rem;
    font-weight:700;
    opacity:0;
  }
  #reveal-caption.show-text{ animation:fade-up .5s ease forwards; animation-delay:.6s; }
  @keyframes fade-up{
    0%{ opacity:0; transform:translateY(10px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  #reveal-continue{
    opacity:0;
    pointer-events:none;
  }
  #reveal-continue.show-text{ animation:fade-up .5s ease forwards; animation-delay:1s; pointer-events:auto; }

  /* ── SITE ── */
  #site{ display:none; position:relative; z-index:2; }

  header.hero{
    text-align:center;
    padding:60px 20px 20px;
  }

  #hero-photos{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:22px;
    min-height:0;
  }

  #hero-photos .polaroid{
    background:#fff;
    padding:8px 8px 20px;
    border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,0.12);
    width:100px;
    animation:bob 4.5s ease-in-out infinite;
  }
  #hero-photos .polaroid:nth-child(2n){ animation-delay:.6s; transform:rotate(-4deg); }
  #hero-photos .polaroid:nth-child(3n){ animation-delay:1.2s; transform:rotate(5deg); }
  #hero-photos .polaroid:nth-child(3n+1){ transform:rotate(-3deg); }
  #hero-photos .polaroid img{ width:100%; height:84px; object-fit:cover; border-radius:4px; display:block; }

  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); }
    50%{ transform:translateY(-10px) rotate(var(--r,0deg)); }
  }

  #hero-emojis{
    font-size:1.8rem;
    margin-bottom:18px;
    display:flex;
    justify-content:center;
    gap:16px;
  }
  #hero-emojis span{ display:inline-block; animation:bob 3.2s ease-in-out infinite; }
  #hero-emojis span:nth-child(2){ animation-delay:.4s; }
  #hero-emojis span:nth-child(3){ animation-delay:.8s; }
  #hero-emojis span:nth-child(4){ animation-delay:1.2s; }

  header.hero h1{
    font-size:2.6rem;
    font-weight:900;
    margin-bottom:10px;
    letter-spacing:-0.5px;
  }

  header.hero p{
    color:var(--muted);
    font-size:1.05rem;
    max-width:480px;
    margin:0 auto;
    line-height:1.7;
    font-weight:500;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:10px 20px 100px;
  }

  section.act{ margin-bottom:60px; }

  section.act .act-head{
    text-align:center;
    margin-bottom:26px;
  }

  section.act .act-badge{
    display:inline-block;
    font-size:0.78rem;
    font-weight:700;
    color:#fff;
    padding:5px 16px;
    border-radius:20px;
    margin-bottom:10px;
  }

  section.act .act-head h2{
    font-size:1.6rem;
    font-weight:800;
  }

  section.act .act-head span{
    display:block;
    color:var(--muted);
    font-size:0.92rem;
    margin-top:4px;
    font-weight:500;
  }

  section.extra .act-head{
    border-top:2px dashed var(--border);
    padding-top:34px;
  }

  .capsule-list{ display:flex; flex-direction:column; gap:16px; }

  .capsule{
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    transform:rotate(var(--tilt, 0deg));
    box-shadow:0 6px 0 var(--shadow-c, var(--border)), 0 10px 24px rgba(0,0,0,0.06);
  }
  .capsule-list .capsule:nth-child(4n+1){ --tilt:-0.7deg; }
  .capsule-list .capsule:nth-child(4n+2){ --tilt:0.6deg; }
  .capsule-list .capsule:nth-child(4n+3){ --tilt:-0.5deg; }
  .capsule-list .capsule:nth-child(4n+4){ --tilt:0.8deg; }

  .capsule:hover{
    transform:rotate(0deg) translateY(-3px) scale(1.01);
  }

  .capsule-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px;
  }

  .capsule-icon{
    font-size:1.5rem;
    flex-shrink:0;
  }

  .capsule-trigger{
    font-size:0.98rem;
    line-height:1.5;
    flex:1;
    font-weight:500;
  }

  .capsule-type{
    font-size:0.72rem;
    font-weight:700;
    color:#fff;
    padding:4px 11px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }

  .capsule-open-btn{
    display:block;
    width:calc(100% - 40px);
    margin:0 20px 18px;
    font-family:'Rubik', sans-serif;
    font-size:0.92rem;
    font-weight:700;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--locked-bg, #fdeee0);
    color:var(--ink);
    cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .capsule-open-btn:hover{ transform:scale(1.03); }
  .capsule-open-btn:active{ transform:scale(0.96); }

  .capsule-body{
    display:none;
    padding:0 20px 22px;
    border-top:2px dashed var(--border);
  }

  .capsule.open .capsule-body{ display:block; padding-top:18px; animation:pop-in .35s cubic-bezier(.34,1.56,.64,1); }
  .capsule.open .capsule-open-btn{ display:none; }

  @keyframes pop-in{
    0%{ opacity:0; transform:scale(0.92) translateY(6px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }

  .capsule-body .letter-text{
    font-size:1.05rem;
    line-height:1.85;
    white-space:pre-line;
    font-weight:400;
  }

  .capsule-body img, .capsule-body video{
    width:100%;
    border-radius:12px;
    display:block;
  }

  .capsule-body audio{ width:100%; }

  .capsule-body .placeholder{
    color:var(--muted);
    font-size:0.92rem;
    text-align:center;
    padding:10px 0;
    font-weight:500;
  }

  /* confetti */
  .confetti-piece{
    position:fixed;
    font-size:1.4rem;
    pointer-events:none;
    z-index:50;
    animation:confetti-pop .8s ease-out forwards;
  }
  @keyframes confetti-pop{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
    100%{ transform:var(--end, translate(0,-120px)) rotate(360deg) scale(0.6); opacity:0; }
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
  }

  #reset-link{
    font-size:0.78rem;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Rubik', sans-serif;
    font-weight:500;
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div id="gate">
  <div id="gate-card">
    <img id="gate-photo" src="media/gate-before.jpg" alt="" hidden>
    <h1>לרוני</h1>
    <p id="gate-subtitle">כמה דברים שהחברים שלך רצו שיחכו לך כאן</p>
    <form id="gate-form">
      <input type="password" id="pw-input" placeholder="סיסמה" autocomplete="off">
      <button class="btn" type="submit">פתחי לי</button>
    </form>
    <div id="gate-error"></div>
  </div>
</div>

<div id="reveal-screen">
  <img id="reveal-photo" src="" alt="">
  <div id="reveal-caption">יאללה, בואי נתחיל</div>
  <button id="reveal-continue" class="btn" type="button">בואי נמשיך ←</button>
</div>

<div id="site">
  <header class="hero">
    <div id="hero-photos"></div>
    <h1 id="site-title">לרוני</h1>
    <p id="site-subtitle">כמה דברים שהחברים שלך רצו שיחכו לך כאן</p>
  </header>
  <main id="main"></main>
  <footer>
    <button id="reset-link">נעלי הכל מחדש</button>
  </footer>
</div>

<script>
const TYPE_META = {
  letter:   { icon: '💌', label: 'מכתב',    color: 'var(--coral)' },
  audio:    { icon: '🎙️', label: 'הקלטה',   color: 'var(--sky)' },
  video:    { icon: '🎥', label: 'וידאו',    color: 'var(--mint)' },
  photo:    { icon: '📷', label: 'תמונה',    color: 'var(--sun)' },
  playlist: { icon: '🎵', label: 'פלייליסט', color: 'var(--sky)' },
  idea:     { icon: '📝', label: 'רעיון',    color: 'var(--mint)' }
};

const ACT_COLORS = [
  { badge:'var(--coral)', shadow:'#ffd8cc' },
  { badge:'var(--sky)',   shadow:'#cdeeff' },
  { badge:'var(--mint)',  shadow:'#c8f3e6' },
  { badge:'var(--sun)',   shadow:'#ffe9b8' }
];

const OPENED_KEY = 'roni_opened_capsules';
const UNLOCK_KEY = 'roni_gate_unlocked';
const CONFETTI = ['🎉','✨','😂','💛','🎊','😄'];

function getOpened(){
  try { return JSON.parse(localStorage.getItem(OPENED_KEY) || '[]'); }
  catch(e){ return []; }
}
function markOpened(id){
  const opened = getOpened();
  if(!opened.includes(id)){
    opened.push(id);
    localStorage.setItem(OPENED_KEY, JSON.stringify(opened));
  }
}

function burstConfetti(x, y){
  for(let i=0;i<10;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = CONFETTI[Math.floor(Math.random()*CONFETTI.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*70;
    const ex = Math.cos(angle)*dist;
    const ey = Math.sin(angle)*dist - 40;
    piece.style.left = x + 'px';
    piece.style.top = y + 'px';
    piece.style.setProperty('--end', `translate(${ex}px, ${ey}px)`);
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 850);
  }
}

function mediaTag(media){
  if(!media) return null;
  const ext = media.split('.').pop().toLowerCase();
  const audioExt = ['mp3','wav','m4a','ogg','aac'];
  const videoExt = ['mp4','mov','webm','m4v'];
  const imgExt   = ['jpg','jpeg','png','gif','webp'];
  const src = 'media/' + media;
  if(audioExt.includes(ext)) return `<audio controls src="${src}"></audio>`;
  if(videoExt.includes(ext)) return `<video controls src="${src}"></video>`;
  if(imgExt.includes(ext))   return `<img src="${src}" alt="">`;
  return `<a href="${src}" target="_blank">פתחי קובץ</a>`;
}

function capsuleBodyHTML(c){
  const parts = [];
  if(c.text){
    parts.push(`<div class="letter-text">${c.text.replace(/</g,'&lt;')}</div>`);
  }
  if(c.media){
    parts.push(mediaTag(c.media));
  }
  if(!c.text && !c.media){
    parts.push(`<div class="placeholder">התוכן בדרך אליך... 💌 (עוד לא הועלה)</div>`);
  }
  return parts.join('');
}

function renderCapsule(c){
  const meta = TYPE_META[c.type] || { icon:'💛', label:'', color:'var(--coral)' };
  const opened = getOpened().includes(c.id);
  const div = document.createElement('div');
  div.className = 'capsule' + (opened ? ' open' : '');
  div.dataset.id = c.id;
  div.innerHTML = `
    <div class="capsule-head">
      <span class="capsule-icon">${meta.icon}</span>
      <span class="capsule-trigger">${c.trigger}</span>
      <span class="capsule-type" style="background:${meta.color}">${meta.label}</span>
    </div>
    <button class="capsule-open-btn" type="button">זה קורה לי עכשיו — פתחי 🎉</button>
    <div class="capsule-body">${capsuleBodyHTML(c)}</div>
  `;
  const btn = div.querySelector('.capsule-open-btn');
  btn.addEventListener('click', (e) => {
    div.classList.add('open');
    markOpened(c.id);
    burstConfetti(e.clientX, e.clientY);
  });
  return div;
}

function renderAct(act, index, extraClass){
  const colors = ACT_COLORS[index % ACT_COLORS.length];
  const section = document.createElement('section');
  section.className = 'act' + (extraClass ? ' ' + extraClass : '');
  section.style.setProperty('--shadow-c', colors.shadow);
  const head = document.createElement('div');
  head.className = 'act-head';
  head.innerHTML = `<span class="act-badge" style="background:${colors.badge}">פרק ${index+1}</span><h2>${act.title}</h2><span>${act.subtitle || ''}</span>`;
  section.appendChild(head);
  const list = document.createElement('div');
  list.className = 'capsule-list';
  list.style.setProperty('--shadow-c', colors.shadow);
  act.capsules.forEach(c => {
    const capsule = renderCapsule(c);
    capsule.style.setProperty('--shadow-c', colors.shadow);
    list.appendChild(capsule);
  });
  section.appendChild(list);
  return section;
}

function renderHeroPhotos(photos){
  const wrap = document.getElementById('hero-photos');
  const emojis = document.getElementById('hero-emojis');
  if(photos && photos.length){
    emojis.style.display = 'none';
    wrap.innerHTML = photos.map(p => `<div class="polaroid"><img src="media/${p}" alt=""></div>`).join('');
  } else {
    wrap.innerHTML = '';
  }
}

function renderSite(data){
  document.getElementById('site-title').textContent = data.site.title || 'לרוני';
  document.getElementById('site-subtitle').textContent = data.site.subtitle || '';
  renderHeroPhotos(data.site.heroPhotos);
  const main = document.getElementById('main');
  main.innerHTML = '';
  let idx = 0;
  data.acts.forEach(act => { main.appendChild(renderAct(act, idx)); idx++; });
  if(data.extra && data.extra.capsules && data.extra.capsules.length){
    main.appendChild(renderAct(data.extra, idx, 'extra'));
  }
}

function showSite(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('reveal-screen').classList.remove('show');
  document.getElementById('site').style.display = 'block';
}

function playReveal(data, onDone){
  document.getElementById('gate').style.display = 'none';
  const screen = document.getElementById('reveal-screen');
  const photo = document.getElementById('reveal-photo');
  const caption = document.getElementById('reveal-caption');
  const continueBtn = document.getElementById('reveal-continue');

  photo.onerror = () => { photo.style.display = 'none'; };
  photo.onload = () => { photo.style.display = 'block'; };
  photo.src = 'media/' + (data.site.revealPhoto || '');
  photo.classList.remove('pop');
  caption.classList.remove('show-text');
  continueBtn.classList.remove('show-text');
  screen.classList.add('show');
  void screen.offsetWidth;

  photo.classList.add('pop');
  caption.classList.add('show-text');
  continueBtn.classList.add('show-text');
  for(let i=0;i<3;i++){
    setTimeout(() => burstConfetti(
      window.innerWidth/2 + (Math.random()-0.5)*160,
      window.innerHeight/2 - 40
    ), 200 + i*180);
  }

  let done = false;
  const finish = () => {
    if(done) return;
    done = true;
    onDone();
  };
  continueBtn.onclick = finish;
  setTimeout(finish, 2600);
}

fetch('content.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('gate-subtitle').textContent = data.site.subtitle || '';

    const gatePhoto = document.getElementById('gate-photo');
    if(data.site.gatePhoto){
      gatePhoto.onload = () => gatePhoto.hidden = false;
      gatePhoto.onerror = () => gatePhoto.hidden = true;
      gatePhoto.src = 'media/' + data.site.gatePhoto;
    }

    if(localStorage.getItem(UNLOCK_KEY) === '1'){
      renderSite(data);
      showSite();
    }

    document.getElementById('gate-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('pw-input').value.trim();
      if(val === (data.site.password || '')){
        localStorage.setItem(UNLOCK_KEY, '1');
        renderSite(data);
        playReveal(data, showSite);
      } else {
        const card = document.getElementById('gate-card');
        const err = document.getElementById('gate-error');
        err.textContent = data.site.gateHint || 'סיסמה לא נכונה, נסי שוב 💛';
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    });
  })
  .catch(() => {
    document.getElementById('gate-error').textContent = 'לא הצלחתי לטעון את התוכן. נסי לרענן.';
  });

document.getElementById('reset-link').addEventListener('click', () => {
  if(confirm('לנעול הכל מחדש?')){
    localStorage.removeItem(OPENED_KEY);
    location.reload();
  }
});
</script>

</body>
</html>
