<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עזרו לרוני</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://roni-contribute.alonzvisabag.workers.dev; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self' https://roni-contribute.alonzvisabag.workers.dev;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --bg1:#fff3da;
    --bg2:#ffdff0;
    --bg3:#dff4ff;
    --ink:#332b2b;
    --muted:#8d7f8a;
    --card:#fffefc;
    --coral:#ff6b4a;
    --coral-dark:#e8512f;
    --sun:#ffb703;
    --mint:#06b88a;
    --sky:#3fa9dd;
    --border:#f0e2d4;
  }

  html{ background:var(--bg1); }

  body{
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    background-size:200% 200%;
  }

  header{
    text-align:center;
    padding:44px 20px 24px;
  }
  header h1{ font-size:1.9rem; font-weight:800; margin-bottom:8px; }
  header p{ color:var(--muted); font-size:0.98rem; max-width:440px; margin:0 auto; line-height:1.6; font-weight:500; }
  header p.sig{ font-size:0.85rem; font-style:italic; margin-top:10px; }

  main{
    max-width:600px;
    margin:0 auto;
    padding:10px 20px 100px;
  }

  section.group{ margin-bottom:34px; }
  section.group h2{ font-size:1.2rem; font-weight:800; margin-bottom:4px; }
  section.group .sub{ color:var(--muted); font-size:0.88rem; margin-bottom:14px; font-weight:500; }

  .cap-list{ display:flex; flex-direction:column; gap:10px; }

  .cap-item{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    text-align:right;
    font-family:'Rubik', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    width:100%;
    transition:transform .15s, box-shadow .15s;
  }
  .cap-item:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,0.06); }
  .cap-item .badge{
    font-size:0.7rem;
    font-weight:700;
    color:#fff;
    padding:3px 9px;
    border-radius:20px;
    flex-shrink:0;
  }

  .new-cap-btn{
    display:block;
    width:100%;
    margin-top:6px;
    padding:16px;
    border-radius:14px;
    border:2px dashed var(--coral);
    background:transparent;
    color:var(--coral-dark);
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:0.98rem;
    cursor:pointer;
  }

  #compose{ display:none; }
  #compose .back-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Rubik', sans-serif;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    margin-bottom:16px;
    padding:6px 0;
  }

  .compose-card{
    background:var(--card);
    border-radius:18px;
    padding:24px 20px;
    border:1.5px solid var(--border);
  }
  .compose-card .trigger-label{
    font-size:1.05rem;
    font-weight:700;
    margin-bottom:18px;
    line-height:1.5;
  }

  label.field-label{
    display:block;
    font-size:0.85rem;
    font-weight:700;
    color:var(--muted);
    margin:16px 0 6px;
  }
  label.field-label:first-of-type{ margin-top:0; }

  input[type="text"], select, textarea{
    width:100%;
    font-family:'Rubik', sans-serif;
    font-size:0.95rem;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:#fff;
    outline:none;
    color:var(--ink);
  }
  input[type="text"]:focus, select:focus, textarea:focus{ border-color:var(--coral); }
  textarea{ min-height:110px; resize:vertical; font-family:'Rubik', sans-serif; }

  .rec-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  button.pill{
    font-family:'Rubik', sans-serif;
    font-size:0.9rem;
    font-weight:700;
    padding:11px 18px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    color:#fff;
    background:var(--sky);
    transition:transform .12s;
  }
  button.pill:hover{ transform:scale(1.03); }
  button.pill:active{ transform:scale(0.97); }
  button.pill.recording{ background:var(--coral); }
  button.pill:disabled{ opacity:0.5; cursor:default; transform:none; }

  #rec-status{ font-size:0.85rem; color:var(--muted); font-weight:600; }

  audio{ width:100%; margin-top:10px; }

  input[type="file"]{
    font-family:'Rubik', sans-serif;
    font-size:0.88rem;
  }

  .submit-row{ margin-top:22px; }

  button#submit-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:none;
    background:linear-gradient(100deg, var(--coral), var(--sun));
    color:#fff;
    font-family:'Rubik', sans-serif;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
    box-shadow:0 6px 0 var(--coral-dark);
    transition:transform .15s;
  }
  button#submit-btn:active{ transform:translateY(2px); box-shadow:0 3px 0 var(--coral-dark); }
  button#submit-btn:disabled{ opacity:0.6; cursor:default; }

  #status-msg{
    margin-top:14px;
    font-size:0.9rem;
    font-weight:600;
    text-align:center;
    min-height:1.3em;
  }
  #status-msg.ok{ color:var(--mint); }
  #status-msg.err{ color:var(--coral-dark); }

  #new-cap-fields{ display:none; }

  .song-embed{
    max-width:480px;
    margin:0 auto 30px;
    padding:0 20px;
  }

  .song-embed .frame{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }

  .song-embed iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
  }
</style>
</head>
<body>

<header>
  <h1>תעזרו לי לעזור לרוני!</h1>
  <p>תבחרו את אחת הסיטואציות שכאן או תיצרו סיטואציה משלכם, תוסיפו תוכן כלשהו (תמונה, סרטון, הקלטה, מכתב) ורוני תוכל לפתוח ולקרוא\לראות\לשמוע בזמנה הפנוי.</p>
  <p class="sig">תודה על שיתוף הפעולה, אלונזו</p>
  <p class="sig">נ.ב. אני נודר נדר שאני לא אציץ במה שכתבתם לה אז תרגישו בנוח לכתוב מה שתרצו :)</p>
</header>

<div class="song-embed">
  <div class="frame">
    <iframe src="https://www.youtube.com/embed/32Zn4Rzga1o" title="מילה טובה - יהודית רביץ" allow="encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<main>
  <div id="list-view"></div>

  <div id="compose">
    <button class="back-btn" type="button" id="back-btn">← חזרה לרשימה</button>
    <div class="compose-card">
      <div class="trigger-label" id="compose-trigger"></div>

      <div id="new-cap-fields">
        <label class="field-label">איזה סוג תוכן זה?</label>
        <select id="new-type">
          <option value="letter">מכתב</option>
          <option value="video">וידאו</option>
          <option value="photo">תמונה</option>
          <option value="audio">הקלטה</option>
        </select>
        <label class="field-label">מתי כדאי לה לפתוח את זה?</label>
        <input type="text" id="new-trigger" placeholder="לדוגמה: ברגע שהיא מתגעגעת הביתה">
      </div>

      <label class="field-label">השם שלכם</label>
      <input type="text" id="from-name" placeholder="מי אתם?" required maxlength="60">

      <div style="position:absolute;left:-9999px;top:-9999px;" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <label class="field-label">מכתב (רשות)</label>
      <textarea id="letter-text" placeholder="כתבו כאן..."></textarea>

      <label class="field-label">הקלטה קולית (רשות)</label>
      <div class="rec-row">
        <button class="pill" type="button" id="rec-btn">הקליטו</button>
        <span id="rec-status"></span>
      </div>
      <audio id="rec-preview" controls style="display:none"></audio>

      <label class="field-label">או צרפו קובץ — תמונה, סרטון או הקלטה (רשות)</label>
      <input type="file" id="file-input" accept="image/*,video/*,audio/*">

      <div class="submit-row">
        <button type="button" id="submit-btn">שלחו לרוני</button>
        <div id="status-msg"></div>
      </div>
    </div>
  </div>
</main>

<script>
const WORKER_URL = 'https://roni-contribute.alonzvisabag.workers.dev/contribute';

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

let selectedCapsuleId = null;
let recordedBlob = null;
let recordedExt = null;
let mediaRecorder = null;
let recChunks = [];

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderList(data){
  const wrap = document.getElementById('list-view');
  wrap.innerHTML = '';

  const allCapsules = data.capsules || [];
  const visibleCapsules = shuffle(allCapsules.filter(c => c.openToFriends === true));

  const list = document.createElement('div');
  list.className = 'cap-list';
  visibleCapsules.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cap-item';
    btn.type = 'button';
    btn.innerHTML = `<span>${escapeHTML(c.trigger)}</span>`;
    btn.addEventListener('click', () => openCompose({ capsuleId: c.id, trigger: c.trigger }));
    list.appendChild(btn);
  });
  wrap.appendChild(list);

  const newBtn = document.createElement('button');
  newBtn.className = 'new-cap-btn';
  newBtn.type = 'button';
  newBtn.textContent = '+ צרו סיטואציה משלכם';
  newBtn.addEventListener('click', () => openCompose({ isNew: true }));
  wrap.appendChild(newBtn);
}

function openCompose({ capsuleId, trigger, isNew }){
  selectedCapsuleId = isNew ? null : capsuleId;
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('compose').style.display = 'block';
  document.getElementById('new-cap-fields').style.display = isNew ? 'block' : 'none';
  document.getElementById('compose-trigger').textContent = isNew ? 'צרו סיטואציה חדשה' : trigger;
  document.getElementById('from-name').value = '';
  document.getElementById('letter-text').value = '';
  document.getElementById('new-trigger').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('website').value = '';
  document.getElementById('status-msg').textContent = '';
  document.getElementById('status-msg').className = '';
  resetRecording();
  window.scrollTo(0, 0);
}

function backToList(){
  document.getElementById('compose').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  stopRecordingStream();
}

function resetRecording(){
  recordedBlob = null;
  recordedExt = null;
  recChunks = [];
  const preview = document.getElementById('rec-preview');
  preview.style.display = 'none';
  if(preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
  preview.removeAttribute('src');
  preview.load();
  document.getElementById('rec-btn').textContent = 'הקליטו';
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-status').textContent = '';
}

let activeStream = null;
function stopRecordingStream(){
  if(activeStream){
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
}

function pickMimeType(){
  const candidates = [
    { mime: 'audio/mp4', ext: 'm4a' },
    { mime: 'audio/webm;codecs=opus', ext: 'webm' },
    { mime: 'audio/webm', ext: 'webm' },
    { mime: 'audio/ogg;codecs=opus', ext: 'ogg' }
  ];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(c.mime)) return c;
  }
  return { mime: '', ext: 'webm' };
}

async function toggleRecording(){
  const btn = document.getElementById('rec-btn');
  const status = document.getElementById('rec-status');

  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }

  try{
    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e){
    status.textContent = 'אין גישה למיקרופון';
    return;
  }

  const picked = pickMimeType();
  recChunks = [];
  mediaRecorder = picked.mime ? new MediaRecorder(activeStream, { mimeType: picked.mime }) : new MediaRecorder(activeStream);
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recordedBlob = new Blob(recChunks, { type: picked.mime || 'audio/webm' });
    recordedExt = picked.ext;
    const preview = document.getElementById('rec-preview');
    preview.src = URL.createObjectURL(recordedBlob);
    preview.style.display = 'block';
    btn.textContent = 'הקליטו שוב';
    btn.classList.remove('recording');
    status.textContent = '';
    stopRecordingStream();
  };
  mediaRecorder.start();
  btn.textContent = 'עצרו הקלטה';
  btn.classList.add('recording');
  status.textContent = 'מקליט...';
}

// iPhone recordings are fragmented MP4, which iPhone players can fail on; rebuild as a regular M4A (null = leave as is).
function remuxFragmentedMp4(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const u32 = (o) => dv.getUint32(o);
  const str4 = (o) => String.fromCharCode(bytes[o], bytes[o + 1], bytes[o + 2], bytes[o + 3]);
  const kids = (start, end) => {
    const out = [];
    let o = start;
    while(o + 8 <= end){
      let size = u32(o);
      let hdr = 8;
      if(size === 1){ size = u32(o + 8) * 4294967296 + u32(o + 12); hdr = 16; }
      else if(size === 0){ size = end - o; }
      if(size < hdr || o + size > end) return [];
      out.push({ type: str4(o + 4), start: o, end: o + size, body: o + hdr });
      o += size;
    }
    return out;
  };
  const find = (list, t) => list.find(b => b.type === t);
  const all = (list, t) => list.filter(b => b.type === t);

  const top = kids(0, bytes.length);
  const moov = find(top, 'moov');
  const moofs = all(top, 'moof');
  if(!moov || !moofs.length) return null;
  const moovKids = kids(moov.body, moov.end);
  const mvhd = find(moovKids, 'mvhd');
  const traks = all(moovKids, 'trak');
  if(!mvhd || traks.length !== 1) return null;
  const mdia = find(kids(traks[0].body, traks[0].end), 'mdia');
  if(!mdia) return null;
  const mdiaKids = kids(mdia.body, mdia.end);
  const mdhd = find(mdiaKids, 'mdhd');
  const hdlr = find(mdiaKids, 'hdlr');
  const minf = find(mdiaKids, 'minf');
  if(!mdhd || !hdlr || !minf || str4(hdlr.body + 8) !== 'soun') return null;
  const minfKids = kids(minf.body, minf.end);
  const smhd = find(minfKids, 'smhd');
  const stbl = find(minfKids, 'stbl');
  const stsd = stbl && find(kids(stbl.body, stbl.end), 'stsd');
  if(!smhd || !stsd) return null;

  const mdhdV1 = bytes[mdhd.body] === 1;
  const timescale = u32(mdhd.body + (mdhdV1 ? 20 : 12));
  const language = dv.getUint16(mdhd.body + (mdhdV1 ? 32 : 20));
  const movieTimescale = u32(mvhd.body + (bytes[mvhd.body] === 1 ? 20 : 12));
  if(!timescale || !movieTimescale) return null;

  let trexDur = 0, trexSize = 0;
  const mvex = find(moovKids, 'mvex');
  const trex = mvex && find(kids(mvex.body, mvex.end), 'trex');
  if(trex){ trexDur = u32(trex.body + 12); trexSize = u32(trex.body + 16); }

  const durations = [], sizes = [], offsets = [];
  for(const moof of moofs){
    for(const traf of all(kids(moof.body, moof.end), 'traf')){
      const trafKids = kids(traf.body, traf.end);
      const tfhd = find(trafKids, 'tfhd');
      if(!tfhd) return null;
      const tf = u32(tfhd.body) & 0xffffff;
      let p = tfhd.body + 8;
      let base = moof.start;
      if(tf & 0x1){ base = u32(p) * 4294967296 + u32(p + 4); p += 8; }
      if(tf & 0x2) p += 4;
      let defDur = trexDur, defSize = trexSize;
      if(tf & 0x8){ defDur = u32(p); p += 4; }
      if(tf & 0x10){ defSize = u32(p); p += 4; }
      let ptr = base;
      for(const trun of all(trafKids, 'trun')){
        const rf = u32(trun.body) & 0xffffff;
        const count = u32(trun.body + 4);
        let q = trun.body + 8;
        if(rf & 0x1){ ptr = base + dv.getInt32(q); q += 4; }
        if(rf & 0x4) q += 4;
        for(let i = 0; i < count; i++){
          let dur = defDur, size = defSize;
          if(rf & 0x100){ dur = u32(q); q += 4; }
          if(rf & 0x200){ size = u32(q); q += 4; }
          if(rf & 0x400) q += 4;
          if(rf & 0x800){ if(u32(q) !== 0) return null; q += 4; }
          if(ptr + size > bytes.length) return null;
          durations.push(dur);
          sizes.push(size);
          offsets.push(ptr);
          ptr += size;
        }
      }
    }
  }
  if(!sizes.length) return null;

  const u32b = (...vals) => {
    const a = new Uint8Array(vals.length * 4);
    const d = new DataView(a.buffer);
    vals.forEach((v, i) => d.setUint32(i * 4, v));
    return a;
  };
  const u32list = (vals) => {
    const a = new Uint8Array(vals.length * 4);
    const d = new DataView(a.buffer);
    for(let i = 0; i < vals.length; i++) d.setUint32(i * 4, vals[i]);
    return a;
  };
  const u16b = (...vals) => {
    const a = new Uint8Array(vals.length * 2);
    const d = new DataView(a.buffer);
    vals.forEach((v, i) => d.setUint16(i * 2, v));
    return a;
  };
  const cat = (parts) => {
    const out = new Uint8Array(parts.reduce((n, x) => n + x.length, 0));
    let o = 0;
    for(const x of parts){ out.set(x, o); o += x.length; }
    return out;
  };
  const box = (type, ...parts) => {
    const body = cat(parts);
    const head = u32b(body.length + 8);
    const t = new Uint8Array([type.charCodeAt(0), type.charCodeAt(1), type.charCodeAt(2), type.charCodeAt(3)]);
    return cat([head, t, body]);
  };
  const copy = (b) => bytes.slice(b.start, b.end);
  const matrix = u32b(0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000);

  const mediaDuration = durations.reduce((n, d) => n + d, 0);
  const movieDuration = Math.round(mediaDuration * movieTimescale / timescale);

  const stts = [];
  for(const d of durations){
    const last = stts[stts.length - 1];
    if(last && last[1] === d) last[0]++;
    else stts.push([1, d]);
  }

  const buildMoov = (dataOffset) => box('moov',
    box('mvhd', u32b(0, 0, 0, movieTimescale, movieDuration, 0x00010000), u16b(0x0100, 0), u32b(0, 0), matrix, new Uint8Array(24), u32b(2)),
    box('trak',
      box('tkhd', u32b(0x00000003, 0, 0, 1, 0, movieDuration, 0, 0), u16b(0, 0, 0x0100, 0), matrix, u32b(0, 0)),
      box('mdia',
        box('mdhd', u32b(0, 0, 0, timescale, mediaDuration), u16b(language, 0)),
        copy(hdlr),
        box('minf',
          copy(smhd),
          box('dinf', box('dref', u32b(0, 1), box('url ', u32b(1)))),
          box('stbl',
            copy(stsd),
            box('stts', u32b(0, stts.length), u32list([].concat(...stts))),
            box('stsc', u32b(0, 1, 1, sizes.length, 1)),
            box('stsz', u32b(0, 0, sizes.length), u32list(sizes)),
            box('stco', u32b(0, 1, dataOffset))
          )
        )
      )
    )
  );

  const ftyp = box('ftyp', new Uint8Array([77, 52, 65, 32]), u32b(0x200), new Uint8Array([77, 52, 65, 32, 105, 115, 111, 109, 105, 115, 111, 50]));
  const moovLen = buildMoov(0).length;
  const newMoov = buildMoov(ftyp.length + moovLen + 8);
  const mdatPayload = new Uint8Array(sizes.reduce((n, s) => n + s, 0));
  let w = 0;
  for(let i = 0; i < sizes.length; i++){
    mdatPayload.set(bytes.subarray(offsets[i], offsets[i] + sizes[i]), w);
    w += sizes[i];
  }
  return cat([ftyp, newMoov, u32b(mdatPayload.length + 8), new Uint8Array([109, 100, 97, 116]), mdatPayload]);
}

async function standardizeAudio(blob){
  try{
    const fixed = remuxFragmentedMp4(new Uint8Array(await blob.arrayBuffer()));
    return fixed ? new Blob([fixed], { type: 'audio/mp4' }) : blob;
  } catch(e){
    return blob;
  }
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function extFromFilename(name){
  return (name.split('.').pop() || '').toLowerCase();
}

// The worker caps base64 at 15M characters, which is about 11.25MB of file.
const MAX_MEDIA_BYTES = 11_000_000;
const MEDIA_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp3', 'wav', 'm4a', 'ogg', 'aac', 'mp4', 'mov', 'webm', 'm4v'];
const ERROR_TEXT = {
  'file too large': 'הקובץ גדול מדי (עד 11MB)',
  'unsupported file type': 'אפשר לצרף רק תמונה, סרטון או הקלטה',
  'name too long': 'השם ארוך מדי',
  'text too long': 'ההודעה ארוכה מדי',
  'nothing to save': 'צריך לכתוב, להקליט או לצרף משהו',
  'situation not available': 'אי אפשר להוסיף לסיטואציה הזאת',
  'too many requests': 'יש עומס כרגע, נסו שוב בעוד כמה דקות'
};

function finishRecording(){
  return new Promise((resolve) => {
    if(!mediaRecorder || mediaRecorder.state !== 'recording'){ resolve(); return; }
    mediaRecorder.addEventListener('stop', () => setTimeout(resolve, 0), { once: true });
    mediaRecorder.stop();
  });
}

let sending = false;

async function submitContribution(){
  if(sending) return;
  const statusEl = document.getElementById('status-msg');
  const submitBtn = document.getElementById('submit-btn');
  const fail = (msg) => {
    statusEl.textContent = msg;
    statusEl.className = 'err';
    sending = false;
    submitBtn.disabled = false;
  };
  sending = true;
  submitBtn.disabled = true;
  await finishRecording();

  const from = document.getElementById('from-name').value.trim();
  const text = document.getElementById('letter-text').value.trim();
  const fileInput = document.getElementById('file-input');
  const file = fileInput.files[0] || null;
  const honeypot = document.getElementById('website').value;

  if(honeypot){
    statusEl.textContent = 'תודה, זה נשמר לרוני!';
    statusEl.className = 'ok';
    setTimeout(() => { sending = false; submitBtn.disabled = false; backToList(); loadCapsules(); }, 1400);
    return;
  }

  if(!from) return fail('צריך לכתוב מי אתם');

  const isNew = !selectedCapsuleId;
  let newCapsule = null;
  if(isNew){
    const trigger = document.getElementById('new-trigger').value.trim();
    if(!trigger) return fail('צריך לכתוב מתי כדאי לה לפתוח את זה');
    newCapsule = {
      type: document.getElementById('new-type').value,
      trigger
    };
  }

  if(!text && !recordedBlob && !file) return fail('צריך לכתוב, להקליט או לצרף משהו');

  let media = null;
  let mediaExt = null;
  if(recordedBlob){
    mediaExt = recordedExt;
    media = recordedExt === 'm4a' ? await standardizeAudio(recordedBlob) : recordedBlob;
    if(media.size > MAX_MEDIA_BYTES) return fail('ההקלטה ארוכה מדי, נסו הקלטה קצרה יותר');
  } else if(file){
    mediaExt = extFromFilename(file.name);
    if(!MEDIA_EXTS.includes(mediaExt)) return fail(ERROR_TEXT['unsupported file type']);
    if(file.size > MAX_MEDIA_BYTES) return fail(ERROR_TEXT['file too large']);
    media = mediaExt === 'm4a' ? await standardizeAudio(file) : file;
  }

  statusEl.textContent = 'שולח...';
  statusEl.className = '';

  try{
    const payload = {
      capsuleId: selectedCapsuleId || undefined,
      newCapsule: newCapsule || undefined,
      from: from || undefined,
      text: text || undefined,
      mediaBase64: media ? await blobToBase64(media) : undefined,
      mediaExt: mediaExt || undefined,
      website: honeypot || undefined
    };

    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({ ok: false, error: res.status === 413 ? 'file too large' : '' }));
    if(data.ok){
      statusEl.textContent = 'תודה, זה נשמר לרוני!';
      statusEl.className = 'ok';
      setTimeout(() => { sending = false; submitBtn.disabled = false; backToList(); loadCapsules(); }, 1400);
      return;
    }
    fail(ERROR_TEXT[data.error] || 'משהו השתבש בשמירה, נסו שוב בעוד רגע');
  } catch(e){
    fail('לא הצלחנו לשלוח, בדקו את החיבור לאינטרנט ונסו שוב');
  }
}

function loadCapsules(){
  return fetch('content.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => { renderList(data); return data; });
}

loadCapsules();
document.getElementById('rec-btn').addEventListener('click', toggleRecording);
document.getElementById('back-btn').addEventListener('click', backToList);
document.getElementById('submit-btn').addEventListener('click', submitContribution);
</script>
