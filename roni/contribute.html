<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עזרו לרוני</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://roni-contribute.alonzvisabag.workers.dev; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self' https://roni-contribute.alonzvisabag.workers.dev;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --bg1:#fff3da;
    --bg2:#ffdff0;
    --bg3:#dff4ff;
    --ink:#332b2b;
    --muted:#8d7f8a;
    --card:#fffefc;
    --coral:#ff6b4a;
    --coral-dark:#e8512f;
    --sun:#ffb703;
    --mint:#06b88a;
    --sky:#3fa9dd;
    --border:#f0e2d4;
  }

  html{ background:var(--bg1); }

  body{
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(120deg, var(--bg1), var(--bg2) 45%, var(--bg3) 100%);
    background-size:200% 200%;
  }

  header{
    text-align:center;
    padding:44px 20px 24px;
  }
  header h1{ font-size:1.9rem; font-weight:800; margin-bottom:8px; }
  header p{ color:var(--muted); font-size:0.98rem; max-width:440px; margin:0 auto; line-height:1.6; font-weight:500; }
  header p.sig{ font-size:0.85rem; font-style:italic; margin-top:10px; }

  main{
    max-width:600px;
    margin:0 auto;
    padding:10px 20px 100px;
  }

  section.group{ margin-bottom:34px; }
  section.group h2{ font-size:1.2rem; font-weight:800; margin-bottom:4px; }
  section.group .sub{ color:var(--muted); font-size:0.88rem; margin-bottom:14px; font-weight:500; }

  .cap-list{ display:flex; flex-direction:column; gap:10px; }

  .cap-item{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    text-align:right;
    font-family:'Rubik', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    width:100%;
    transition:transform .15s, box-shadow .15s;
  }
  .cap-item:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,0.06); }
  .cap-item span:first-child{ flex:1; }
  .cap-item .empty-tag{
    font-size:0.7rem;
    font-weight:700;
    color:var(--coral-dark);
    background:#fff1ec;
    border:1.5px solid #ffc9b8;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .cap-item.is-empty{ border-color:#ffc9b8; }

  .new-cap-btn{
    display:block;
    width:100%;
    margin-top:6px;
    padding:16px;
    border-radius:14px;
    border:2px dashed var(--coral);
    background:transparent;
    color:var(--coral-dark);
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:0.98rem;
    cursor:pointer;
  }

  #compose{ display:none; }
  #compose .back-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Rubik', sans-serif;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    margin-bottom:16px;
    padding:6px 0;
  }

  .compose-card{
    background:var(--card);
    border-radius:18px;
    padding:24px 20px;
    border:1.5px solid var(--border);
  }
  .compose-card .trigger-label{
    font-size:1.05rem;
    font-weight:700;
    margin-bottom:18px;
    line-height:1.5;
  }

  label.field-label{
    display:block;
    font-size:0.85rem;
    font-weight:700;
    color:var(--muted);
    margin:16px 0 6px;
  }
  label.field-label:first-of-type{ margin-top:0; }

  input[type="text"], select, textarea{
    width:100%;
    font-family:'Rubik', sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:#fff;
    outline:none;
    color:var(--ink);
  }
  input[type="text"]:focus, select:focus, textarea:focus{ border-color:var(--coral); }
  textarea{ min-height:110px; resize:vertical; font-family:'Rubik', sans-serif; }

  .rec-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  [hidden]{ display:none !important; }
  .pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:44px;
    font-family:'Rubik', sans-serif;
    font-size:0.9rem;
    font-weight:700;
    padding:11px 18px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    color:#fff;
    background:var(--sky);
    transition:transform .12s;
  }
  .pill:hover{ transform:scale(1.03); }
  .pill:active{ transform:scale(0.97); }
  .pill.quiet{ background:#fff; color:var(--muted); border:1.5px solid var(--border); }
  .pill.recording{ background:var(--coral); }
  .pill:disabled{ opacity:0.5; cursor:default; transform:none; }

  #rec-status{ font-size:0.85rem; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }

  audio{ width:100%; margin-top:10px; }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; opacity:0; }
  .attach-list:empty{ display:none; }
  .attach-list{ margin-bottom:10px; }
  .attach{ display:flex; align-items:center; gap:12px; padding:8px; border:1.5px solid var(--border); border-radius:12px; background:#fff; }
  .attach .thumb{ position:relative; width:52px; height:52px; border-radius:10px; overflow:hidden; flex-shrink:0; background:#eaf6fc; color:var(--sky); display:flex; align-items:center; justify-content:center; }
  .attach .thumb img, .attach .thumb video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .attach .thumb svg{ position:relative; width:22px; height:22px; }
  .attach .thumb video + svg{ color:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .attach .info{ flex:1; min-width:0; }
  .attach .info b{ display:block; font-size:0.92rem; }
  .attach .info span{ display:block; font-size:0.78rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .attach .remove{ width:44px; height:44px; flex-shrink:0; border:none; border-radius:50%; background:#fff0ec; color:var(--coral-dark); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .attach .remove svg{ width:18px; height:18px; }
  .field-error{ color:var(--coral-dark); font-size:0.82rem; font-weight:700; margin-top:6px; }

  .submit-row{ margin-top:22px; }

  button#submit-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:none;
    background:linear-gradient(100deg, var(--coral), var(--sun));
    color:#fff;
    font-family:'Rubik', sans-serif;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
    box-shadow:0 6px 0 var(--coral-dark);
    transition:transform .15s;
  }
  button#submit-btn:active{ transform:translateY(2px); box-shadow:0 3px 0 var(--coral-dark); }
  button#submit-btn:disabled{ opacity:0.6; cursor:default; }

  #status-msg{
    margin-top:14px;
    font-size:0.9rem;
    font-weight:600;
    text-align:center;
    min-height:1.3em;
  }
  #status-msg.ok{ color:var(--mint); }
  #status-msg.err{ color:var(--coral-dark); }

  #new-cap-fields{ display:none; }

  .song-embed{
    max-width:480px;
    margin:0 auto 30px;
    padding:0 20px;
  }

  .song-embed .frame{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }

  .song-embed iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
  }
</style>
</head>
<body>

<header>
  <h1>תעזרו לי לעזור לרוני!</h1>
  <p>תבחרו את אחת הסיטואציות שכאן או תיצרו סיטואציה משלכם, תוסיפו תוכן כלשהו (תמונה, סרטון, הקלטה, מכתב) ורוני תוכל לפתוח ולקרוא\לראות\לשמוע בזמנה הפנוי.</p>
  <p class="sig">תודה על שיתוף הפעולה, אלונזו</p>
  <p class="sig">נ.ב. אני נודר נדר שאני לא אציץ במה שכתבתם לה אז תרגישו בנוח לכתוב מה שתרצו :)</p>
</header>

<div class="song-embed">
  <div class="frame">
    <iframe src="https://www.youtube.com/embed/32Zn4Rzga1o" title="מילה טובה - יהודית רביץ" allow="encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<main>
  <div id="list-view"></div>

  <div id="compose">
    <button class="back-btn" type="button" id="back-btn">← חזרה לרשימה</button>
    <div class="compose-card">
      <div class="trigger-label" id="compose-trigger"></div>

      <div id="new-cap-fields">
        <label class="field-label">איזה סוג תוכן זה?</label>
        <select id="new-type">
          <option value="letter">מכתב</option>
          <option value="video">וידאו</option>
          <option value="photo">תמונה</option>
          <option value="audio">הקלטה</option>
        </select>
        <label class="field-label">מתי כדאי לה לפתוח את זה?</label>
        <input type="text" id="new-trigger" placeholder="לדוגמה: ברגע שהיא מתגעגעת הביתה">
      </div>

      <label class="field-label">השם שלכם</label>
      <input type="text" id="from-name" placeholder="מי אתם?" required maxlength="60">

      <div style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0;" aria-hidden="true">
        <label for="hp-extra">Leave empty</label>
        <input type="text" id="hp-extra" name="hp-extra" tabindex="-1" autocomplete="off">
      </div>

      <label class="field-label">מכתב (רשות)</label>
      <textarea id="letter-text" placeholder="כתבו כאן..."></textarea>

      <label class="field-label">הקלטה קולית (רשות)</label>
      <div class="rec-row">
        <button class="pill" type="button" id="rec-btn">הקליטו</button>
        <button class="pill quiet" type="button" id="rec-del" hidden>מחיקת ההקלטה</button>
        <span id="rec-status"></span>
      </div>
      <audio id="rec-preview" controls style="display:none"></audio>

      <label class="field-label">צרפו קובץ — תמונה, סרטון או הקלטה (רשות)</label>
      <div class="attach-list" id="attach-list"></div>
      <label class="pill" for="file-input" id="add-file">+ בחירת קובץ</label>
      <input type="file" id="file-input" class="visually-hidden" accept="image/*,video/*,audio/*">
      <div class="field-error" id="file-error"></div>

      <div class="submit-row">
        <button type="button" id="submit-btn">שלחו לרוני</button>
        <div id="status-msg"></div>
      </div>
    </div>
  </div>
</main>

<script src="../lib/media-prep.js"></script>
<script>
const WORKER_URL = 'https://roni-contribute.alonzvisabag.workers.dev/contribute';

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

let selectedCapsuleId = null;
let recordedBlob = null;
let recordedExt = null;
let mediaRecorder = null;
let recChunks = [];

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderList(data){
  const wrap = document.getElementById('list-view');
  wrap.innerHTML = '';

  const open = (data.capsules || []).filter(c => c.openToFriends === true);
  const isEmpty = (c) => !(c.items || []).length;
  const visibleCapsules = [...shuffle(open.filter(isEmpty)), ...shuffle(open.filter(c => !isEmpty(c)))];

  const list = document.createElement('div');
  list.className = 'cap-list';
  visibleCapsules.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cap-item' + (isEmpty(c) ? ' is-empty' : '');
    btn.type = 'button';
    btn.innerHTML = `<span>${escapeHTML(c.trigger)}</span>` + (isEmpty(c) ? '<span class="empty-tag">עוד לא כתבו כאן</span>' : '');
    btn.addEventListener('click', () => openCompose({ capsuleId: c.id, trigger: c.trigger }));
    list.appendChild(btn);
  });
  wrap.appendChild(list);

  const newBtn = document.createElement('button');
  newBtn.className = 'new-cap-btn';
  newBtn.type = 'button';
  newBtn.textContent = '+ צרו סיטואציה משלכם';
  newBtn.addEventListener('click', () => openCompose({ isNew: true }));
  wrap.appendChild(newBtn);
}

function openCompose({ capsuleId, trigger, isNew }){
  selectedCapsuleId = isNew ? null : capsuleId;
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('compose').style.display = 'block';
  document.getElementById('new-cap-fields').style.display = isNew ? 'block' : 'none';
  document.getElementById('compose-trigger').textContent = isNew ? 'צרו סיטואציה חדשה' : trigger;
  document.getElementById('from-name').value = '';
  document.getElementById('letter-text').value = '';
  document.getElementById('new-trigger').value = '';
  clearAttachment();
  document.getElementById('hp-extra').value = '';
  document.getElementById('status-msg').textContent = '';
  document.getElementById('status-msg').className = '';
  resetRecording();
  window.scrollTo(0, 0);
}

function backToList(){
  document.getElementById('compose').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  stopRecordingStream();
}

function resetRecording(){
  recordedBlob = null;
  recordedExt = null;
  recChunks = [];
  const preview = document.getElementById('rec-preview');
  preview.style.display = 'none';
  if(preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
  preview.removeAttribute('src');
  preview.load();
  document.getElementById('rec-btn').textContent = 'הקליטו';
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-del').hidden = true;
  document.getElementById('rec-status').textContent = '';
}

let activeStream = null;
let recTimer = null;
function stopRecordingStream(){
  if(activeStream){
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
  clearInterval(recTimer);
}

async function toggleRecording(){
  const btn = document.getElementById('rec-btn');
  const status = document.getElementById('rec-status');

  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }

  if(!window.MediaRecorder || !navigator.mediaDevices){
    status.textContent = 'אי אפשר להקליט מכאן. נסו לפתוח את הקישור בספארי או בכרום';
    return;
  }
  try{
    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e){
    status.textContent = 'אין גישה למיקרופון. צריך לאשר גישה, או לפתוח את הקישור בספארי או בכרום';
    return;
  }

  const picked = pickMimeType();
  recChunks = [];
  try{
    mediaRecorder = picked.mime ? new MediaRecorder(activeStream, { mimeType: picked.mime }) : new MediaRecorder(activeStream);
  } catch(e){
    stopRecordingStream();
    status.textContent = 'אי אפשר להקליט מכאן. נסו לפתוח את הקישור בספארי או בכרום';
    return;
  }
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recordedBlob = new Blob(recChunks, { type: picked.mime || 'audio/webm' });
    recordedExt = picked.ext;
    const preview = document.getElementById('rec-preview');
    preview.src = URL.createObjectURL(recordedBlob);
    preview.style.display = 'block';
    btn.textContent = 'הקליטו שוב';
    btn.classList.remove('recording');
    document.getElementById('rec-del').hidden = false;
    status.textContent = '';
    stopRecordingStream();
  };
  mediaRecorder.start();
  btn.textContent = 'עצרו הקלטה';
  btn.classList.add('recording');
  document.getElementById('rec-del').hidden = true;
  const startedAt = Date.now();
  const showTime = () => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    status.textContent = `מקליט... ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  showTime();
  recTimer = setInterval(showTime, 500);
}

// The worker caps base64 at 15M characters, which is about 11.25MB of file.
const MAX_MEDIA_BYTES = 11_000_000;
const MEDIA_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp3', 'wav', 'm4a', 'ogg', 'aac', 'mp4', 'mov', 'webm', 'm4v'];
const IMAGE_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif'];
const VIDEO_EXTS = ['mp4', 'mov', 'webm', 'm4v'];
const AUDIO_EXTS = ['mp3', 'wav', 'm4a', 'ogg', 'aac'];
const ERROR_TEXT = {
  'file too large': 'הקובץ גדול מדי (עד 11MB)',
  'unsupported file type': 'אפשר לצרף רק תמונה, סרטון או הקלטה',
  'name too long': 'השם ארוך מדי',
  'text too long': 'ההודעה ארוכה מדי',
  'nothing to save': 'צריך לכתוב, להקליט או לצרף משהו',
  'situation not available': 'אי אפשר להוסיף לסיטואציה הזאת',
  'too many requests': 'יש עומס כרגע, נסו שוב בעוד כמה דקות',
  'network': 'לא הצלחנו לשלוח, בדקו את החיבור לאינטרנט ונסו שוב'
};
const VIDEO_TOO_BIG = 'הסרטון הזה גדול מדי לשליחה. אפשר לקצר אותו בגלריה (עריכה ← חיתוך) ולבחור אותו שוב, או לבחור סרטון קצר יותר';
const ICONS = {
  video: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  remove: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const KIND_LABEL = { image: 'תמונה', video: 'סרטון', audio: 'הקלטה' };

let attachment = null;

function kindOf(file, ext){
  const type = file.type || '';
  if(IMAGE_EXTS.includes(ext) || type.startsWith('image/')) return 'image';
  if(VIDEO_EXTS.includes(ext) || type.startsWith('video/')) return 'video';
  if(AUDIO_EXTS.includes(ext) || type.startsWith('audio/')) return 'audio';
  return null;
}

function renderAttachment(){
  const list = document.getElementById('attach-list');
  list.textContent = '';
  document.getElementById('add-file').textContent = attachment ? 'החלפת הקובץ' : '+ בחירת קובץ';
  if(!attachment) return;
  const a = attachment;
  const row = document.createElement('div');
  row.className = 'attach';
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if(a.kind === 'image'){
    const img = document.createElement('img');
    img.alt = '';
    img.src = a.url;
    img.onerror = () => { img.remove(); thumb.innerHTML = ICONS.image; };
    thumb.appendChild(img);
  } else if(a.kind === 'video'){
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'metadata';
    v.src = a.url + '#t=0.1';
    thumb.appendChild(v);
    thumb.insertAdjacentHTML('beforeend', ICONS.video);
  } else {
    thumb.innerHTML = ICONS.audio;
  }
  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('b');
  title.textContent = KIND_LABEL[a.kind];
  const name = document.createElement('span');
  name.textContent = a.file.name || '';
  info.append(title, name);
  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'remove';
  remove.setAttribute('aria-label', 'הסרה');
  remove.innerHTML = ICONS.remove;
  remove.addEventListener('click', clearAttachment);
  row.append(thumb, info, remove);
  list.appendChild(row);
}

function clearAttachment(){
  if(attachment && attachment.url) URL.revokeObjectURL(attachment.url);
  attachment = null;
  document.getElementById('file-input').value = '';
  document.getElementById('file-error').textContent = '';
  renderAttachment();
}

function pickFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const ext = extFromFile(file);
  const kind = kindOf(file, ext);
  let error = '';
  if(!kind || (kind !== 'image' && !MEDIA_EXTS.includes(ext))) error = ERROR_TEXT['unsupported file type'];
  // Photos get shrunk before sending; videos and recordings have to fit as they are.
  else if(kind !== 'image' && file.size > MAX_MEDIA_BYTES) error = kind === 'video' ? VIDEO_TOO_BIG : 'ההקלטה הזאת ארוכה מדי לשליחה';
  if(error){
    document.getElementById('file-error').textContent = error;
    return;
  }
  clearAttachment();
  attachment = { file, ext, kind, url: kind === 'audio' ? null : URL.createObjectURL(file) };
  renderAttachment();
}

async function prepareAttachment(a){
  if(a.kind === 'image' && a.ext !== 'gif'){
    const mustConvert = !MEDIA_EXTS.includes(a.ext);
    const small = await shrinkImage(a.file, mustConvert);
    if(small) return { blob: small, ext: 'jpg' };
    if(mustConvert) return { error: 'את התמונה הזאת אי אפשר לשלוח. נסו לבחור אותה מהגלריה' };
  }
  if(!MEDIA_EXTS.includes(a.ext)) return { error: ERROR_TEXT['unsupported file type'] };
  if(a.file.size > MAX_MEDIA_BYTES) return { error: a.kind === 'video' ? VIDEO_TOO_BIG : ERROR_TEXT['file too large'] };
  if(a.ext === 'm4a') return { blob: await standardizeAudio(a.file), ext: a.ext };
  if(a.ext === 'jpg' || a.ext === 'jpeg') return { blob: await removeLocation(a.file), ext: a.ext };
  return { blob: a.file, ext: a.ext };
}

function finishRecording(){
  return new Promise((resolve) => {
    if(!mediaRecorder || mediaRecorder.state !== 'recording'){ resolve(); return; }
    mediaRecorder.addEventListener('stop', () => setTimeout(resolve, 0), { once: true });
    mediaRecorder.stop();
  });
}

async function sendPart(payload){
  try{
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return await res.json().catch(() => ({ ok: false, error: res.status === 413 ? 'file too large' : '' }));
  } catch(e){
    return { ok: false, error: 'network' };
  }
}

let sending = false;

async function submitContribution(){
  if(sending) return;
  const statusEl = document.getElementById('status-msg');
  const submitBtn = document.getElementById('submit-btn');
  const textInput = document.getElementById('letter-text');
  const fail = (msg) => {
    statusEl.textContent = msg;
    statusEl.className = 'err';
    sending = false;
    submitBtn.disabled = false;
  };
  const done = () => {
    statusEl.textContent = 'תודה, זה נשמר לרוני!';
    statusEl.className = 'ok';
    setTimeout(() => { sending = false; submitBtn.disabled = false; backToList(); loadCapsules(); }, 1400);
  };
  sending = true;
  submitBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = '';
  await finishRecording();

  const from = document.getElementById('from-name').value.trim();
  const text = textInput.value.trim();
  const honeypot = document.getElementById('hp-extra').value;

  if(honeypot) return done();
  if(!from) return fail('צריך לכתוב מי אתם');

  const isNew = !selectedCapsuleId;
  let newCapsule = null;
  if(isNew){
    const trigger = document.getElementById('new-trigger').value.trim();
    if(!trigger) return fail('צריך לכתוב מתי כדאי לה לפתוח את זה');
    newCapsule = {
      type: document.getElementById('new-type').value,
      trigger
    };
  }

  if(!text && !recordedBlob && !attachment) return fail('צריך לכתוב, להקליט או לצרף משהו');
  // A new situation gets its id only when it is saved, so it can take one recording or file.
  if(isNew && recordedBlob && attachment){
    return fail('בסיטואציה חדשה אפשר לצרף רק אחד: הקלטה או קובץ. מחקו אחד מהם, ואת השני תוכלו להוסיף אחר כך כשהסיטואציה תופיע ברשימה');
  }

  // Everything is checked before the first send, so a problem never leaves half of it behind.
  const parts = [];
  if(recordedBlob || attachment) statusEl.textContent = 'מכינים את הקבצים...';
  if(recordedBlob){
    const blob = recordedExt === 'm4a' ? await standardizeAudio(recordedBlob) : recordedBlob;
    if(blob.size > MAX_MEDIA_BYTES) return fail('ההקלטה ארוכה מדי, נסו הקלטה קצרה יותר');
    parts.push({ blob, ext: recordedExt, done: resetRecording });
  }
  if(attachment){
    const ready = await prepareAttachment(attachment);
    if(ready.error) return fail(ready.error);
    parts.push({ blob: ready.blob, ext: ready.ext, done: clearAttachment });
  }
  if(!parts.length) parts.push(null);

  // A recording and a file are saved one after the other; the first save carries the text.
  // Whatever was saved leaves the form, so sending again after a failure only sends what is left.
  let pendingText = text;
  for(let i = 0; i < parts.length; i++){
    const part = parts[i];
    statusEl.textContent = parts.length > 1 ? `שולח... (${i + 1} מתוך ${parts.length})` : 'שולח...';
    const data = await sendPart({
      capsuleId: selectedCapsuleId || undefined,
      newCapsule: newCapsule || undefined,
      from,
      text: pendingText || undefined,
      mediaBase64: part ? await blobToBase64(part.blob) : undefined,
      mediaExt: part ? part.ext : undefined
    });
    if(!data.ok){
      const reason = ERROR_TEXT[data.error] || 'משהו השתבש בשמירה, נסו שוב בעוד רגע';
      return fail(i > 0 ? `${reason}. חלק כבר נשמר, ומה שנשאר בטופס עוד לא נשלח` : reason);
    }
    if(pendingText){ pendingText = ''; textInput.value = ''; }
    if(part) part.done();
  }
  done();
}

function loadCapsules(){
  return fetch('content.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => { renderList(data); return data; });
}

loadCapsules();
document.getElementById('rec-btn').addEventListener('click', toggleRecording);
document.getElementById('rec-del').addEventListener('click', resetRecording);
document.getElementById('file-input').addEventListener('change', pickFile);
document.getElementById('back-btn').addEventListener('click', backToList);
document.getElementById('submit-btn').addEventListener('click', submitContribution);
</script>

</body>
