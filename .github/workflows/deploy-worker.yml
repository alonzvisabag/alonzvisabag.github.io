name: Deploy Roni Worker

on:
  push:
    branches: [main]
    paths:
      - 'roni/worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 60b15b007f3920528239a7076af2c17a
          workingDirectory: roni/worker
