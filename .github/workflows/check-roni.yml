# A health check for Roni's site, run by hand from the Actions tab: are the pages up, does the worker answer
# for the words, countdowns and colours, does it still turn away other sites, and does the contribution
# endpoint answer. It only reads; nothing is saved or sent. Results show as notes on the run.
name: Check Roni's site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pages and worker
        run: |
          W=https://roni-contribute.alonzvisabag.workers.dev
          O="Origin: https://alonzvisabag.github.io"
          for p in roni/ roni/contribute.html roni/content.json roni/words.json roni/countdowns.json roni/prefs.json; do
            echo "::notice::page $p → $(curl -s -o /dev/null -w '%{http_code}' https://alonzvisabag.github.io/$p)"
          done
          for p in words countdowns prefs; do
            echo "::notice::worker /$p → $(curl -s -H "$O" $W/$p | jq -c '{ok, items: ((.words // .countdowns // .prefs // []) | length), error}')"
          done
          echo "::notice::worker /words from another site → $(curl -s -o /dev/null -w '%{http_code}' $W/words) (403 expected)"
      # each of these is turned away before anything is written or any Telegram message goes out
      - name: Sending, without saving anything
        run: |
          W=https://roni-contribute.alonzvisabag.workers.dev
          O="Origin: https://alonzvisabag.github.io"
          J='Content-Type: application/json'
          echo "::notice::contribute, unknown site → $(curl -s -X POST -H "$O" -H "$J" -d '{"site":"__check__"}' $W/contribute) (unknown site expected)"
          echo "::notice::contribute, bot trap → $(curl -s -X POST -H "$O" -H "$J" -d '{"website":"x"}' $W/contribute) (ok expected)"
          echo "::notice::contribute, no such situation → $(curl -s -X POST -H "$O" -H "$J" -d '{"capsuleId":"__check__","from":"check","text":"check"}' $W/contribute) (situation not available expected: it read the site's content)"
          echo "::notice::words, an empty change → $(curl -s -X POST -H "$O" -H "$J" -d '{"ops":[]}' $W/words | jq -c '{ok, words: (.words | length)}')"
          echo "::notice::sos, unknown number → $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$O" -d '{"to":"__check__"}' $W/sos) (204 expected)"
          echo "::notice::preflight → $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H "$O" $W/contribute), allows $(curl -s -D - -o /dev/null -X OPTIONS -H "$O" $W/contribute | tr -d '\r' | grep -i '^access-control-allow-origin' | cut -d' ' -f2)"
