<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לגלית</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --bg1:#f6f3ec;
    --bg2:#eef1e5;
    --bg3:#f5e9e2;
    --ink:#2f3a2c;
    --muted:#7b8474;
    --card:#fffdf8;
    --leaf:#8aa37b;
    --leaf-light:#a9bf97;
    --leaf-dark:#5f7a52;
    --bloom:#cf8a76;
    --bloom-dark:#ad6653;
    --lilac:#9c8fb8;
    --border:#e7e4d7;
  }

  html{ background:var(--bg1); }
  body{
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment:fixed;
  }
  [hidden]{ display:none !important; }

  .serif{ font-family:'Frank Ruhl Libre', serif; }
  .leaf-text{
    background:linear-gradient(135deg, var(--leaf-light), var(--leaf-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .overline{
    display:inline-block;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--leaf-dark);
    border:1.5px solid rgba(111,138,98,0.45);
    border-radius:30px;
    padding:5px 14px;
    margin-bottom:18px;
  }

  /* full-screen states */
  .screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 22px;
  }
  .screen h1{ font-size:3.2rem; font-weight:900; line-height:1.05; margin-bottom:14px; }
  .screen p{ color:var(--muted); font-size:1.02rem; line-height:1.7; max-width:420px; font-weight:500; }

  .clock{ display:flex; gap:10px; margin-top:30px; direction:rtl; }
  .clock div{
    background:var(--card);
    border-radius:18px;
    width:74px;
    padding:14px 0 10px;
    box-shadow:0 10px 30px rgba(63,84,54,0.08);
  }
  .clock b{ display:block; font-family:'Frank Ruhl Libre', serif; font-size:1.9rem; font-weight:900; color:var(--leaf-dark); line-height:1.1; }
  .clock span{ font-size:0.75rem; color:var(--muted); font-weight:600; }

  .open-btn{
    margin-top:34px;
    font-family:'Rubik', sans-serif;
    font-size:1.05rem;
    font-weight:800;
    padding:16px 34px;
    border-radius:40px;
    border:none;
    color:#fff;
    background:linear-gradient(100deg, var(--leaf-light), var(--leaf-dark));
    box-shadow:0 6px 0 #4f6844, 0 18px 40px rgba(95,122,82,0.28);
    cursor:pointer;
  }
  .open-btn:active{ transform:translateY(2px); box-shadow:0 3px 0 #4f6844; }

  /* site */
  #site header{ text-align:center; padding:54px 22px 10px; }
  #site header h1{ font-size:3rem; font-weight:900; line-height:1.05; margin-bottom:12px; }
  #site header p{ color:var(--muted); font-size:1rem; line-height:1.7; max-width:440px; margin:0 auto; font-weight:500; }

  .medal{
    position:relative;
    width:176px;
    height:176px;
    margin:22px auto 4px;
  }
  .medal .wreath{ position:absolute; inset:0; width:100%; height:100%; }
  .medal-core{
    position:absolute;
    inset:36px;
    border-radius:50%;
    background:var(--card);
    box-shadow:0 10px 26px rgba(63,84,54,0.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .medal b{ font-family:'Frank Ruhl Libre', serif; font-size:2.6rem; font-weight:900; line-height:1; color:var(--ink); }
  .medal span{ font-size:0.8rem; font-weight:700; margin-top:4px; color:var(--leaf-dark); }

  main{ max-width:600px; margin:0 auto; padding:18px 18px 80px; }

  .tabs{
    display:flex;
    gap:4px;
    padding:4px;
    margin-bottom:18px;
    background:rgba(255,255,255,0.6);
    border-radius:16px;
    position:sticky;
    top:10px;
    z-index:5;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
  }
  .tab{
    flex:1;
    padding:10px 4px;
    border:none;
    border-radius:12px;
    background:none;
    font-family:'Rubik', sans-serif;
    font-size:0.88rem;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.on{ background:var(--card); color:var(--leaf-dark); box-shadow:0 4px 12px rgba(95,122,82,0.14); }
  .tab small{ font-weight:600; opacity:0.75; }

  .wall{ display:flex; flex-direction:column; gap:16px; }
  .greeting{
    background:var(--card);
    border-radius:22px;
    padding:20px 20px 22px;
    box-shadow:0 12px 32px rgba(63,84,54,0.07);
  }
  .g-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .g-name{ font-family:'Frank Ruhl Libre', serif; font-size:1.25rem; font-weight:900; flex:1; }
  .g-tag{ font-size:0.72rem; font-weight:700; color:#fff; padding:4px 11px; border-radius:20px; flex-shrink:0; }
  .g-tag.family{ background:var(--bloom); }
  .g-tag.friends{ background:var(--leaf); }
  .g-tag.work{ background:var(--lilac); }
  .g-text{ font-size:1.05rem; line-height:1.85; white-space:pre-line; }
  .g-text + .g-media{ margin-top:14px; }
  .g-media img, .g-media video{ width:100%; border-radius:14px; display:block; }
  .g-media audio{ width:100%; }
  .empty{ text-align:center; color:var(--muted); padding:40px 20px; font-weight:500; }
  body{ position:relative; z-index:0; }
  body::before, body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    z-index:-1;
    pointer-events:none;
  }
  body::before{ width:340px; height:340px; background:#c9d8b8; top:-120px; left:-130px; }
  body::after{ width:300px; height:300px; background:#f1d2c5; bottom:-110px; right:-120px; }
  .sprig{ display:block; width:132px; height:auto; margin:0 auto 12px; }
</style>
</head>

="140.8" cy="21.1" rx="4.8" ry="2.0" transform="rotate(-113.5 140.8 21.1)" fill="#8aa37b"/><ellipse cx="121.0" cy="23.1" rx="4.5" ry="1.9" transform="rotate(-195.0 121.0 23.1)" fill="#8aa37b"/><ellipse cx="124.1" cy="14.5" rx="4.5" ry="1.9" transform="rotate(-125.0 124.1 14.5)" fill="#a9bf97"/></svg><div class="medal-core"><b id="total">0</b><span>ברכות</span></div></div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="wall" id="wall"></div>
  </main>
</div>

<script>
const GROUPS = [
  { key: 'all', label: 'הכל' },
  { key: 'family', label: 'משפחה' },
  { key: 'friends', label: 'חברות' },
  { key: 'work', label: 'עבודה' }
];
const IMG_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
const AUDIO_EXT = ['mp3', 'wav', 'm4a', 'ogg', 'aac'];
const VIDEO_EXT = ['mp4', 'mov', 'webm', 'm4v'];

let greetings = [];
let activeTab = 'all';

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function mediaHTML(file){
  const ext = file.split('.').pop().toLowerCase();
  const src = escapeHTML('media/' + encodeURIComponent(file));
  if(IMG_EXT.includes(ext)) return `<img src="${src}" alt="" loading="lazy">`;
  if(VIDEO_EXT.includes(ext)) return `<video controls playsinline preload="metadata" src="${src}"></video>`;
  if(AUDIO_EXT.includes(ext)) return `<audio controls preload="metadata" src="${src}"></audio>`;
  return '';
}

function greetingHTML(g){
  const group = GROUPS.find(x => x.key === g.group);
  return `
    <article class="greeting">
      <div class="g-head">
        <span class="g-name">${escapeHTML(g.from || '')}</span>
        ${group ? `<span class="g-tag ${g.group}">${group.label}</span>` : ''}
      </div>
      ${g.text ? `<div class="g-text">${escapeHTML(g.text)}</div>` : ''}
      ${g.media ? `<div class="g-media">${mediaHTML(g.media)}</div>` : ''}
    </article>`;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = GROUPS.map(t => {
    const n = t.key === 'all' ? greetings.length : greetings.filter(g => g.group === t.key).length;
    return `<button type="button" class="tab${t.key === activeTab ? ' on' : ''}" data-tab="${t.key}">${t.label} <small>${n}</small></button>`;
  }).join('');
}

function renderWall(){
  const shown = activeTab === 'all' ? greetings : greetings.filter(g => g.group === activeTab);
  document.getElementById('wall').innerHTML = shown.length
    ? shown.map(greetingHTML).join('')
    : '<div class="empty">עוד אין כאן ברכות</div>';
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if(!b) return;
  activeTab = b.dataset.tab;
  renderTabs();
  renderWall();
});

function startCountdown(target){
  const tick = () => {
    const left = target - Date.now();
    if(left <= 0){ location.reload(); return; }
    const s = Math.floor(left / 1000);
    document.getElementById('cd-d').textContent = Math.floor(s / 86400);
    document.getElementById('cd-h').textContent = Math.floor(s % 86400 / 3600);
    document.getElementById('cd-m').textContent = Math.floor(s % 3600 / 60);
    document.getElementById('cd-s').textContent = s % 60;
  };
  tick();
  setInterval(tick, 1000);
  document.getElementById('countdown').hidden = false;
}

function showSite(){
  document.getElementById('intro').hidden = true;
  document.getElementById('site').hidden = false;
  document.getElementById('total').textContent = greetings.length;
  renderTabs();
  renderWall();
  window.scrollTo(0, 0);
}

fetch('content.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    // Opens at midnight Israel time on the birthday; ?preview lets the family check it beforehand.
    const unlock = new Date((data.site.birthday || '2026-10-05') + 'T00:00:00+03:00').getTime();
    const preview = new URLSearchParams(location.search).has('preview');
    if(Date.now() < unlock && !preview){
      startCountdown(unlock);
      return;
    }
    greetings = data.greetings || [];
    document.getElementById('intro').hidden = false;
  });

document.getElementById('open-btn').addEventListener('click', showSite);
</script>
</body>
