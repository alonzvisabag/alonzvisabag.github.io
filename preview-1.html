    <style>
        /* ── Version 1: the words come alive ── */
        :root {
            --bg: #0b0b0e;
            --ink: #f2efe8;
            --muted: #8b8b94;
            --acc: #ff7a45;
            --veg: #8fd65f;
            --fx: 50vw;
            --fy: 40vh;
            --r: 170px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--bg); }
        body {
            font-family: 'Rubik', sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* the word wall: dim in the dark, lit where the flashlight points */
        .wall {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            padding: 16px 20px;
            font-size: 1rem;
            line-height: 1.85;
            color: #1e1e24;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 0 32px;
            user-select: none;
        }
        .wall span { white-space: nowrap; cursor: pointer; transition: color 0.2s; }
        .wall.lit {
            color: #ffe2a8;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle var(--r) at var(--fx) var(--fy), #000 0%, rgba(0,0,0,0.75) 40%, transparent 100%);
                    mask-image: radial-gradient(circle var(--r) at var(--fx) var(--fy), #000 0%, rgba(0,0,0,0.75) 40%, transparent 100%);
            text-shadow: 0 0 12px rgba(255,190,90,0.35);
        }

        #word-pop {
            position: fixed;
            z-index: 60;
            background: #fff6e0;
            color: #111;
            border-radius: 14px;
            padding: 12px 16px 10px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.4);
            min-width: 180px;
            animation: pop 0.25s cubic-bezier(.2,.9,.3,1.4);
        }
        #word-pop[hidden] { display: none; }
        #word-pop b { display: block; font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
        #word-pop span { display: block; font-size: 0.8rem; color: #555; margin: 2px 0 6px; }
        #word-pop a { font-size: 0.85rem; font-weight: 600; color: #d4471a; text-decoration: none; }
        @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }

        /* nav */
        nav {
            direction: ltr;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(rgba(11,11,14,0.85), rgba(11,11,14,0));
        }
        nav a { color: var(--ink); text-decoration: none; }
        nav .name { font-weight: 500; font-size: 1.05rem; letter-spacing: 0.14em; text-transform: uppercase; }
        nav .links { display: flex; gap: 28px; align-items: center; }
        nav [data-cv] {
            font-weight: 600;
            letter-spacing: 0.1em;
            border: 1.5px solid rgba(242,239,232,0.5);
            border-radius: 30px;
            padding: 6px 16px;
            transition: background 0.2s, color 0.2s;
        }
        nav [data-cv]:hover { background: var(--ink); color: var(--bg); }
        .ig-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }
        .ig-icon::before {
            content: '';
            position: absolute;
            inset: -5px;
            background: conic-gradient(#f09433, #e6683c, #dc2743, #cc2366, #bc1888, #833ab4, #f09433);
            animation: spin 3s linear infinite;
        }
        .ig-icon::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
        .ig-icon svg { width: 24px; height: 24px; stroke: #fff; position: relative; z-index: 2; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* hero */
        .hero {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 110px 20px 70px;
            pointer-events: none;
        }
        /* a soft dark pool behind the name and line, so the lit words never fight the text */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse 52% 34% at 50% 50%, rgba(11,11,14,0.96) 35%, rgba(11,11,14,0) 100%);
        }
        .big-name {
            font-size: min(11.5vw, 168px);
            line-height: 1;
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: -0.01em;
            color: var(--ink);
            text-shadow: 0 0 40px rgba(0,0,0,0.9);
            margin-bottom: 34px;
        }
        .big-name .w { display: inline-block; }
        .big-name .ch { display: inline-block; }
        .hero-line {
            font-size: clamp(1.15rem, 2.6vw, 1.9rem);
            font-weight: 300;
            line-height: 1.6;
            max-width: 760px;
            color: #d9d5cc;
            text-shadow: 0 0 18px rgba(0,0,0,0.95);
        }
        .hero-line em { font-style: italic; font-weight: 700; color: var(--acc); font-size: 1.35em; }
        .caret { color: var(--acc); animation: blink 0.8s step-end infinite; font-weight: 300; }
        @keyframes blink { 50% { opacity: 0; } }
        .scroll-hint {
            position: absolute;
            bottom: 26px;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: var(--muted);
            animation: bob 2s ease-in-out infinite;
        }
        @keyframes bob { 50% { transform: translateY(6px); } }

        /* the path that draws itself */
        #path { position: relative; z-index: 2; width: 100%; pointer-events: none; }
        #path svg { position: absolute; top: 0; left: 0; z-index: 1; overflow: visible; }
        .p-item {
            position: absolute;
            z-index: 2;
            pointer-events: auto;
            translate: 0 -50%;
            opacity: 0;
            scale: 0.82;
            transition: opacity 0.6s ease, scale 0.6s cubic-bezier(.2,.9,.3,1.25);
            display: block;
            text-decoration: none;
            color: var(--ink);
        }
        .p-item.in { opacity: 1; scale: 1; }
        .p-item img { width: 100%; display: block; }
        .p-post img { border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .p-logo img { border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 14px 50px rgba(255,122,69,0.25); }
        .p-veg img { border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,0.6); }
        .p-post:hover img, .p-veg:hover img { transform: rotate(-3deg) scale(1.05); }
        .p-post img, .p-veg img { transition: transform 0.3s; }
        .p-head {
            aspect-ratio: 1;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 800;
            font-size: 1.35rem;
            line-height: 1.2;
            border: 2px solid currentColor;
            background: rgba(11,11,14,0.75);
            box-shadow: 0 0 26px -4px currentColor, inset 0 0 22px -8px currentColor;
        }
        .p-head small { font-size: 0.75rem; font-weight: 400; opacity: 0.85; }
        .head-veg { color: var(--veg); }
        .head-gift { color: var(--acc); }
        .head-port { color: #b9b4ff; }
        .mini-phone {
            display: block;
            aspect-ratio: 390 / 664;
            padding: 5px;
            border-radius: 20px;
            background: #000;
            box-shadow: 0 0 0 1px #333, 0 14px 40px rgba(0,0,0,0.7);
            transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
        }
        .mini-phone img { height: 100%; object-fit: cover; border-radius: 15px; }
        .tilt-r .mini-phone { transform: rotate(4deg); }
        .tilt-l .mini-phone { transform: rotate(-4deg); }
        .p-phone:hover .mini-phone { transform: rotate(0) translateY(-6px) scale(1.05); }
        .cap {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.3;
            text-shadow: 0 0 10px #000;
        }
        .cap small { display: block; font-weight: 400; font-size: 0.75rem; color: var(--acc); }

        /* chat */
        .chat-sec {
            position: relative;
            z-index: 2;
            padding: 120px 20px 90px;
            text-align: center;
        }
        .kicker { color: var(--acc); font-size: 0.9rem; letter-spacing: 0.08em; font-weight: 500; }
        .chat-sec h2 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; margin: 6px 0 34px; text-shadow: 0 0 30px #000; }

        footer {
            position: relative;
            z-index: 2;
            direction: ltr;
            text-align: center;
            padding: 30px 20px 70px;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            nav { padding: 14px 16px; }
            nav .name { font-size: 0.82rem; letter-spacing: 0.08em; }
            nav .links { gap: 14px; }
            .ig-icon { width: 42px; height: 42px; }
            .wall { font-size: 0.85rem; line-height: 2; gap: 0 20px; }
            :root { --r: 120px; }
            .hero::before { background: radial-gradient(ellipse 85% 30% at 50% 50%, rgba(11,11,14,0.96) 40%, rgba(11,11,14,0) 100%); }
            .p-head { font-size: 1rem; border-radius: 14px; }
            .p-head small { font-size: 0.62rem; }
            .mini-phone { padding: 4px; border-radius: 15px; }
            .mini-phone img { border-radius: 11px; }
            .cap { font-size: 0.8rem; }
            .chat-sec { padding: 90px 12px 70px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .p-item { opacity: 1; scale: 1; transition: none; }
            .scroll-hint, .caret, .ig-icon::before { animation: none; }
        }
    </style>
</head>

<script>
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const root  = document.documentElement;

    // Hebrew file names are set from here so they're encoded safely
    document.querySelectorAll('img[data-src]').forEach(img => { img.src = encodeURIComponent(img.dataset.src); });

    // ── Word wall (two identical layers: dim, and lit by the flashlight) ──
    const wall = document.getElementById('wall');
    const lit  = document.getElementById('wall-lit');
    function fillWalls() {
        const small = innerWidth < 600;
        const lineH = (small ? 0.85 * 16 * 2 : 16 * 1.85);
        const total = (Math.ceil(innerHeight / lineH) + 2) * (Math.ceil(innerWidth / (small ? 110 : 160)) + 1);
        const list = [];
        while (list.length < total) list.push(...OLD_WORDS);
        const html = list.slice(0, total).map(w => `<span>${w}</span>`).join('');
        wall.innerHTML = html;
        lit.innerHTML = html;
    }
    fillWalls();

    // ── Flashlight: follows the mouse or finger, and wanders by itself when left alone ──
    let px = innerWidth / 2, py = innerHeight * 0.4;     // where the light is
    let tx = px, ty = py;                                  // where it's heading
    let lastMove = -1e9;
    addEventListener('pointermove', (e) => { tx = e.clientX; ty = e.clientY; lastMove = performance.now(); }, { passive: true });
    addEventListener('pointerdown', (e) => { tx = e.clientX; ty = e.clientY; lastMove = performance.now(); }, { passive: true });

    // ── Big name: each letter gets heavier near the pointer (and breathes on its own) ──
    const nameEl = document.getElementById('big-name');
    nameEl.innerHTML = nameEl.textContent.split(' ').map(w =>
        `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`).join(' ');
    const letters = Array.from(nameEl.querySelectorAll('.ch'));

    function frame(now) {
        const idle = now - lastMove > 2500;
        if (idle && !still) {
            tx = innerWidth  * (0.5 + 0.36 * Math.sin(now / 2900));
            ty = innerHeight * (0.45 + 0.3 * Math.sin(now / 1900 + 1));
        }
        px += (tx - px) * (idle ? 0.04 : 0.25);
        py += (ty - py) * (idle ? 0.04 : 0.25);
        root.style.setProperty('--fx', px.toFixed(1) + 'px');
        root.style.setProperty('--fy', py.toFixed(1) + 'px');

        if (!still) {
            const rects = letters.map(el => el.getBoundingClientRect());   // read all first, then write
            letters.forEach((el, i) => {
                const r = rects[i];
                const d = Math.hypot(r.left + r.width / 2 - px, r.top + r.height / 2 - py);
                const near = Math.exp(-(d * d) / (2 * 170 * 170));
                const wave = 0.5 + 0.5 * Math.sin(now / 700 - i * 0.55);
                el.style.fontWeight = Math.round(300 + 600 * Math.max(near, wave * 0.35));
            });
        }
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ── Tap a word for a little card ──
    const pop = document.getElementById('word-pop');
    let popTimer;
    wall.addEventListener('click', (e) => {
        const w = e.target.closest('span');
        if (!w) return;
        pop.querySelector('b').textContent = '״' + w.textContent + '״';
        pop.hidden = false;
        const x = Math.min(innerWidth - pop.offsetWidth - 12, Math.max(12, e.clientX - pop.offsetWidth / 2));
        const y = Math.min(innerHeight - pop.offsetHeight - 12, e.clientY + 16);
        pop.style.left = x + 'px';
        pop.style.top = y + 'px';
        clearTimeout(popTimer);
        popTimer = setTimeout(() => { pop.hidden = true; }, 4500);
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('#word-pop, .wall')) pop.hidden = true; });

    // ── Hero line types itself after the paper plane lands (or is simply there on a return visit) ──
    const l1 = document.getElementById('l1'), l2 = document.getElementById('l2'), caret = document.getElementById('caret');
    const T1 = 'פסיכולוגיה + עסקים + יותר מדי רעיונות טובים לשמור לעצמי.';
    const T2 = 'בואו נתחיל.';
    const heroLine = document.getElementById('hero-line');
    l1.textContent = T1; l2.textContent = T2;
    heroLine.style.minHeight = heroLine.offsetHeight + 'px';
    l1.textContent = ''; l2.textContent = '';
    Intro.whenDone((instant) => {
        if (instant || still) { l1.textContent = T1; l2.textContent = T2; caret.style.display = 'none'; return; }
        let i = 0;
        (function type1() {
            l1.textContent = T1.slice(0, i++);
            if (i <= T1.length) return setTimeout(type1, 38);
            caret.style.display = 'none';
            let j = 0;
            setTimeout(function type2() {
                l2.textContent = T2.slice(0, j++);
                if (j <= T2.length) setTimeout(type2, 70);
            }, 350);
        })();
    });

    // ── The path draws itself as you scroll, and each piece pops in when the line reaches it ──
    const path = document.getElementById('path');
    const items = Array.from(path.querySelectorAll('.p-item'));
    const svgNS = 'http://www.w3.org/2000/svg';
    let clipRect, pathTop = 0;

    function layoutPath() {
        const vw = path.clientWidth;
        const cx = vw / 2, amp = cx * 0.52, waves = 4;
        const baseW = Math.min(130, vw * 0.22), logoW = Math.min(230, vw * 0.4), headW = Math.min(170, vw * 0.3), phoneW = Math.min(150, vw * 0.27);
        const H = Math.max(innerHeight * 3, items.length * 290);
        path.style.height = H + 'px';
        pathTop = path.getBoundingClientRect().top + scrollY;

        const xAt = (t) => cx + amp * Math.sin(t * waves * Math.PI * 2);
        const pts = [];
        for (let y = 0; y <= H; y += 4) pts.push(`${xAt(y / H).toFixed(1)},${y}`);

        const old = path.querySelector('svg');
        if (old) old.remove();
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('width', vw);
        svg.setAttribute('height', H);
        svg.innerHTML = `
            <defs><clipPath id="reveal"><rect x="0" y="0" width="${vw}" height="0"/></clipPath></defs>
            <g clip-path="url(#reveal)">
                <polyline points="${pts.join(' ')}" fill="none" stroke="#ff7a45" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round"/>
                <polyline points="${pts.join(' ')}" fill="none" stroke="#ff7a45" stroke-width="2.5" stroke-dasharray="8 12" stroke-linecap="round"/>
            </g>`;
        path.prepend(svg);
        clipRect = svg.querySelector('#reveal rect');

        items.forEach((item, i) => {
            const w = item.classList.contains('p-logo') ? logoW
                    : item.classList.contains('p-head-item') ? headW
                    : item.classList.contains('p-phone') ? phoneW : baseW;
            const t = (i + 0.5) / items.length;
            const x = xAt(t), y = t * H;
            item.style.width = w + 'px';
            item.style.left = (x - w / 2) + 'px';
            item.style.top = y + 'px';
            item.dataset.y = y;
            if (item.classList.contains('p-logo') || item.classList.contains('p-head-item')) {
                const dot = document.createElementNS(svgNS, 'circle');
                dot.setAttribute('cx', x.toFixed(1));
                dot.setAttribute('cy', y.toFixed(1));
                dot.setAttribute('r', '7');
                dot.setAttribute('fill', '#ff7a45');
                dot.setAttribute('stroke', '#0b0b0e');
                dot.setAttribute('stroke-width', '3');
                svg.querySelector('g').appendChild(dot);
            }
        });
        reveal();
    }

    function reveal() {
        const H = parseFloat(path.style.height);
        const drawn = still ? H : Math.max(0, Math.min(H, scrollY + innerHeight * 0.62 - pathTop));
        clipRect.setAttribute('height', drawn);
        items.forEach(item => { if (+item.dataset.y < drawn + 40) item.classList.add('in'); });
    }

    let ticking = false;
    addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => { ticking = false; reveal(); });
    }, { passive: true });

    let resizeTimer;
    addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { fillWalls(); layoutPath(); }, 150);
    });
    addEventListener('load', layoutPath);
    layoutPath();
</script>
</body>
</html>
